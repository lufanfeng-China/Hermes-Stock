<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瓶颈股发现 — Serenity 方法论</title>
  <link rel="stylesheet" href="/dark-terminal-table-styling.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-card-hover: #1c2333;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #f78166;
      --accent2: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --bottleneck-bg: #1a1215;
      --bottleneck-border: #f8514980;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* ── Top Bar ── */
    .topbar {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .topbar .logo { font-size: 20px; font-weight: 700; color: var(--accent); }
    .topbar nav { display: flex; gap: 4px; margin-left: 24px; }
    .topbar nav a {
      color: var(--text-muted); text-decoration: none;
      padding: 6px 14px; border-radius: 6px; font-size: 14px;
      transition: all .2s;
    }
    .topbar nav a:hover, .topbar nav a.active {
      color: var(--text); background: var(--bg-card-hover);
    }
    .topbar nav a.active { color: var(--accent); }
    .topbar .actions { margin-left: auto; display: flex; gap: 8px; }
    .btn {
      padding: 8px 18px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg-card); color: var(--text); cursor: pointer;
      font-size: 13px; transition: all .15s;
    }
    .btn:hover { background: var(--bg-card-hover); border-color: #555; }
    .btn-primary {
      background: var(--accent); color: #0d1117; border-color: var(--accent);
      font-weight: 600;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-accent2 { border-color: var(--accent2); color: var(--accent2); }
    .btn-accent2:hover { background: rgba(88,166,255,.1); }

    /* ── Layout ── */
    .main-layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 260px; min-width: 260px;
      background: var(--bg-card); border-right: 1px solid var(--border);
      padding: 16px 12px; overflow-y: auto;
    }
    .sidebar h3 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin: 16px 0 8px 4px; }
    .step-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px; cursor: pointer;
      margin-bottom: 4px; font-size: 14px; transition: all .15s;
    }
    .step-item:hover { background: var(--bg-card-hover); }
    .step-item.active { background: rgba(247,129,102,.1); border: 1px solid rgba(247,129,102,.3); }
    .step-item.done { color: var(--green); }
    .step-icon {
      width: 28px; height: 28px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 13px;
      background: var(--bg); border: 1px solid var(--border); flex-shrink: 0;
    }
    .step-item.active .step-icon { background: var(--accent); color: #0d1117; border-color: var(--accent); }
    .step-item.done .step-icon { background: var(--green); color: #0d1117; border-color: var(--green); }

    .work-area {
      flex: 1; overflow-y: auto; padding: 24px 32px;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* ── Cards ── */
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px;
    }
    .card h2 { font-size: 18px; margin-bottom: 16px; color: var(--accent2); }
    .card h3 { font-size: 15px; margin: 16px 0 8px; }
    .card p { line-height: 1.6; color: var(--text-muted); margin-bottom: 8px; }

    /* ── Supply Chain Map ── */
    .chain-layer {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 16px; border-left: 3px solid var(--border);
      margin-bottom: 4px; transition: all .2s;
    }
    .chain-layer.bottleneck {
      background: var(--bottleneck-bg);
      border-left-color: var(--red);
    }
    .chain-layer.bottleneck-secondary {
      background: rgba(210,153,34,.05);
      border-left-color: var(--yellow);
    }
    .chain-layer .layer-num {
      font-size: 12px; color: var(--text-muted); min-width: 24px;
    }
    .chain-layer .layer-content { flex: 1; }
    .chain-layer .layer-content .layer-name {
      font-weight: 600; font-size: 15px; margin-bottom: 4px;
    }
    .chain-layer .layer-content .layer-role {
      font-size: 13px; color: var(--text-muted); margin-bottom: 4px;
    }
    .chain-layer .layer-content .layer-players {
      font-size: 12px; color: var(--text-muted);
    }
    .chain-layer .layer-content .layer-reason {
      font-size: 12px; margin-top: 4px; line-height: 1.5;
    }
    .chain-layer .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600; margin-left: 8px;
    }
    .badge-bottleneck { background: rgba(248,81,73,.15); color: var(--red); }
    .badge-skip { background: rgba(139,148,158,.1); color: var(--text-muted); }
    .badge-score { background: rgba(247,129,102,.15); color: var(--accent); }
    .badge-warn { background: rgba(210,153,34,.1); color: var(--yellow); }

    /* ── Tables ── */
    .data-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    .data-table th {
      text-align: left; padding: 8px 12px;
      color: var(--text-muted); font-weight: 500;
      border-bottom: 1px solid var(--border); font-size: 11px;
      text-transform: uppercase;
    }
    .data-table td {
      padding: 10px 12px; border-bottom: 1px solid rgba(48,54,61,.5);
    }
    .data-table tr:hover td { background: rgba(255,255,255,.02); }

    /* ── Risk Checklist ── */
    .risk-item {
      padding: 10px 14px; margin-bottom: 6px;
      border-left: 3px solid var(--yellow);
      background: rgba(210,153,34,.03); border-radius: 0 6px 6px 0;
    }
    .risk-item .risk-q { font-weight: 500; margin-bottom: 2px; }
    .risk-item .risk-trigger { font-size: 12px; color: var(--text-muted); }

    /* ── Progress/Status ── */
    .status-running { color: var(--accent2); }
    .status-done { color: var(--green); }
    .status-error { color: var(--red); }

    .welcome-box {
      text-align: center; padding: 60px 20px;
    }
    .welcome-box h1 { font-size: 26px; margin-bottom: 12px; }
    .welcome-box p { font-size: 16px; color: var(--text-muted); max-width: 600px; margin: 0 auto 24px; }

    .trend-select {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px; margin-top: 12px;
    }
    .trend-card {
      padding: 16px; border: 1px solid var(--border); border-radius: 10px;
      cursor: pointer; transition: all .15s;
    }
    .trend-card:hover { border-color: var(--accent); background: rgba(247,129,102,.03); }
    .trend-card.selected { border-color: var(--accent); background: rgba(247,129,102,.06); }
    .trend-card .trend-name { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
    .trend-card .trend-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
    .trend-card .trend-anchor { font-size: 12px; color: var(--accent2); margin-top: 6px; }

    .summary-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px; margin: 12px 0;
    }
    .summary-item {
      background: rgba(255,255,255,.02); padding: 14px; border-radius: 8px;
      text-align: center;
    }
    .summary-item .val { font-size: 28px; font-weight: 700; color: var(--accent); }
    .summary-item .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .report-card { border: 1px solid var(--accent); }
    .report-card .final-conclusion {
      padding: 20px; background: rgba(247,129,102,.05);
      border-radius: 8px; margin-top: 16px;
      font-size: 15px; line-height: 1.7;
    }

    /* ── Loading ── */
    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .6s linear infinite; margin-left: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .work-area { padding: 12px; }
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <div class="topbar">
    <span class="logo">🔬 瓶颈股发现</span>
    <nav>
      <a href="/">RPS</a>
      <a href="/stock-score.html">财务评分</a>
      <a href="/stock-screener.html">股票筛选</a>
      <a href="/stock-realtime-screener.html">实时选股</a>
      <a href="/watchlist.html">自选股</a>
      <a href="/data-update.html">数据更新</a>
      <a href="/bottleneck.html" class="active">瓶颈股发现</a>
      <a href="/kanban.html">Kanban</a>
    </nav>
    <div class="actions">
      <button class="btn btn-accent2" onclick="toggleHistory()">📋 历史报告</button>
      <button class="btn btn-primary" onclick="startAuto()">⚡ 一键全自动</button>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="main-layout">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <h3>研究步骤</h3>
      <div class="step-item" id="step-nav-1" onclick="navigateStep(1)">
        <span class="step-icon">1</span> 选择趋势
      </div>
      <div class="step-item" id="step-nav-2" onclick="navigateStep(2)">
        <span class="step-icon">2</span> 拆解产业链
      </div>
      <div class="step-item" id="step-nav-3" onclick="navigateStep(3)">
        <span class="step-icon">3</span> 识别瓶颈层
      </div>
      <div class="step-item" id="step-nav-4" onclick="navigateStep(4)">
        <span class="step-icon">4</span> 映射 A 股标的
      </div>
      <div class="step-item" id="step-nav-5" onclick="navigateStep(5)">
        <span class="step-icon">5</span> 系统数据验证
      </div>
      <div class="step-item" id="step-nav-6" onclick="navigateStep(6)">
        <span class="step-icon">6</span> Serenity 交叉验证
      </div>
      <div class="step-item" id="step-nav-7" onclick="navigateStep(7)">
        <span class="step-icon">7</span> 最终报告
      </div>

      <h3>历史报告</h3>
      <div id="history-list" style="font-size:12px;color:var(--text-muted);">
        加载中...
      </div>
    </div>

    <!-- Work Area -->
    <div class="work-area" id="work-area">
      <!-- Welcome -->
      <div class="card" id="welcome-card">
        <div class="welcome-box">
          <h1>🔬 瓶颈股发现</h1>
          <p>
            基于 Serenity「紫苏叶理论」：从超级趋势出发，逐层拆解产业链，
            找到全球供应商 ≤2 家的「卡脖子」环节，挖掘被市场忽视的瓶颈股。
          </p>
          <p style="color:var(--text-muted);font-size:14px;">
            选择一条趋势开始，或点击 <b>「一键全自动」</b> 直接跑完 7 步。
          </p>
        </div>
      </div>

      <!-- Step cards will be injected here -->
    </div>
  </div>

  <!-- K-line Chart Dialog -->
  <div id="kline-chart-dialog" class="industry-score-peer-dialog" hidden aria-hidden="true">
    <div class="kline-chart-dialog-card" role="dialog" aria-modal="true" aria-labelledby="kline-chart-title">
      <div class="search-card-header">
        <div>
          <p class="eyebrow">K-LINE CHART</p>
          <h2 id="kline-chart-title">K线趋势图</h2>
        </div>
        <button id="kline-chart-close" type="button" class="sub-period-industry-average-btn">关闭</button>
      </div>
      <div class="kline-chart-body">
        <svg id="kline-chart-svg" class="kline-chart-svg" role="img" aria-label="K线趋势图"></svg>
      </div>
    </div>
  </div>

  <!-- History Popup -->
  <div id="history-popup" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:900px;width:90%;max-height:80vh;overflow-y:auto;">
      <h3 style="margin-bottom:16px;">📋 历史报告</h3>
      <div id="history-popup-content">加载中...</div>
      <button class="btn" onclick="toggleHistory()" style="margin-top:12px;">关闭</button>
    </div>
  </div>

  <script type="module" src="/bottleneck.js"></script>
</body>
</html>
