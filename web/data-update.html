<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据更新</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .update-shell {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .freshness-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
    .freshness-card {
      padding: 12px 16px;
      border: 1px solid rgba(124,224,195,0.15);
      border-radius: 10px;
      background: rgba(124,224,195,0.03);
    }
    .freshness-card .label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .freshness-card .value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .freshness-card .sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .task-list {
      border: 1px solid rgba(124,224,195,0.15);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .task-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(124,224,195,0.06);
      transition: background 0.15s;
    }
    .task-row:last-child { border-bottom: none; }
    .task-row.running {
      background: rgba(124,224,195,0.08);
    }
    .task-row.done {
      opacity: 0.7;
    }
    .task-row.failed {
      background: rgba(255,107,107,0.06);
    }
    .task-status {
      width: 24px;
      text-align: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .task-num {
      width: 24px;
      text-align: right;
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .task-info {
      flex: 1;
      min-width: 0;
    }
    .task-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .task-running .task-name { color: var(--accent); }
    .task-done .task-name { color: var(--muted); }
    .task-failed .task-name { color: var(--danger); }
    .task-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .task-time {
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
      text-align: right;
    }

    .progress-bar-wrap {
      margin-bottom: 20px;
      display: none;
    }
    .progress-bar-wrap.active { display: block; }
    .progress-outer {
      height: 6px;
      background: rgba(124,224,195,0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-inner {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.5s ease;
      width: 0%;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .progress-text {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .action-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-start {
      padding: 10px 28px;
      border: 1px solid var(--accent);
      background: rgba(124,224,195,0.1);
      color: var(--accent);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .btn-start:hover { background: rgba(124,224,195,0.2); }
    .btn-start:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-retry {
      padding: 10px 20px;
      border: 1px solid rgba(255,193,7,0.3);
      background: rgba(255,193,7,0.08);
      color: var(--warning);
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .btn-retry:hover { background: rgba(255,193,7,0.15); }
    .btn-retry[hidden] { display: none; }

    .error-banner {
      padding: 12px 16px;
      border: 1px solid rgba(255,107,107,0.2);
      border-radius: 10px;
      background: rgba(255,107,107,0.06);
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .error-banner.active { display: block; }

    .status-line {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 12px;
      font-style: italic;
    }
  </style>
</head>
<body>
<main class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">DATA UPDATE TERMINAL</p>
      <h1>数据更新</h1>
    </div>
    <div class="topbar-actions" id="global-nav"></div>
  </header>

  <div class="update-shell">
    <!-- Freshness -->
    <div class="freshness-grid" id="freshness-grid">
      <div class="freshness-card">
        <div class="label">财务快照</div>
        <div class="value" id="fs-date">读取中...</div>
        <div class="sub" id="fs-report">—</div>
      </div>
      <div class="freshness-card">
        <div class="label">行业估值快照</div>
        <div class="value" id="iv-date">读取中...</div>
        <div class="sub" id="iv-detail">—</div>
      </div>
      <div class="freshness-card">
        <div class="label">最后数据更新时间</div>
        <div class="value" id="latest-date">读取中...</div>
        <div class="sub">所有数据集的最新时间</div>
      </div>
      <div class="freshness-card">
        <div class="label">RPS 快照</div>
        <div class="value">跟随行业估值快照时间</div>
        <div class="sub">依赖 RPS 历史数据</div>
      </div>
    </div>

    <!-- Error banner -->
    <div class="error-banner" id="error-banner"></div>

    <!-- Progress -->
    <div class="progress-bar-wrap" id="progress-wrap">
      <div class="progress-outer">
        <div class="progress-inner" id="progress-bar"></div>
      </div>
      <div class="progress-text">
        <span id="progress-label">正在准备...</span>
        <span id="progress-pct">0%</span>
      </div>
    </div>

    <!-- Status line -->
    <div class="status-line" id="status-line">点击"启动更新"开始数据刷新</div>

    <!-- Task list -->
    <div class="task-list" id="task-list"></div>

    <!-- Actions -->
    <div class="action-bar">
      <button class="btn-start" id="btn-start" type="button">▶ 启动更新</button>
      <button class="btn-retry" id="btn-retry" type="button" hidden>↻ 重试失败项</button>
    </div>
  </div>
</main>

<script src="/nav.js"></script>
<script>
// ── State ──
let tasks = [];
let running = false;
let pollTimer = null;
let currentJobStatus = 'idle';

// ── Helpers ──
const $ = (id) => document.getElementById(id);

function statusIcon(taskStatus) {
  switch (taskStatus) {
    case 'running': return '🔄';
    case 'done': return '✅';
    case 'failed': return '❌';
    default: return '⏳';
  }
}

function rowClass(taskStatus) {
  switch (taskStatus) {
    case 'running': return 'task-running';
    case 'done': return 'task-done';
    case 'failed': return 'task-failed';
    default: return '';
  }
}

// ── Render ──
function renderFreshness(status) {
  $('fs-date').textContent = status.financial_snapshot_updated || '—';
  $('fs-report').textContent = status.financial_report_date
    ? `报告期 ${status.financial_report_date}`
    : '无快照数据';
  $('iv-date').textContent = status.industry_valuation_updated || '—';
  $('iv-detail').textContent = status.industry_count
    ? `覆盖 ${status.industry_count} 个行业`
    : '—';
  $('latest-date').textContent = status.latest_updated_at || '—';
}

function renderTasks(taskList, job) {
  const container = $('task-list');
  const currentStep = job.current_step || '';

  // Map job step names from pipeline (e.g., 'rebuild_screener_first') to task ids
  const stepMap = {
    'archive_daily': 'archive_daily',
    'update_financial_ts': 'update_financial_ts',
    'build_financial_snapshot': 'build_financial_snapshot',
    'build_industry_relative_valuation_snapshot': 'build_industry_relative_valuation_snapshot',
    'build_rps_history': 'build_rps_history',
    'update_rps_current': 'update_rps_current',
    'rebuild_screener_first': 'rebuild_screener_rps_first',
    'rebuild_screener_ma_cross': 'rebuild_screener_ma_cross',
    'rebuild_screener_washout': 'rebuild_screener_washout',
    'rebuild_screener_rps_climb': 'rebuild_screener_rps_climb',
    'rebuild_screener_blowup_stall': 'rebuild_screener_blowup_stall',
    'rebuild_screener_blowup_break': 'rebuild_screener_blowup_break',
  };
  const currentTaskId = stepMap[currentStep] || currentStep;

  let runningIdx = -1;
  if (job.running) {
    if (currentTaskId && currentTaskId !== 'init') {
      runningIdx = taskList.findIndex(t => t.id === currentTaskId);
    }
    // If 'init' or not mapped, highlight the first pending task
    if (runningIdx < 0) {
      runningIdx = taskList.findIndex((t, i) => {
        // First task that isn't done (in case of retry)
        return true;
      });
      if (runningIdx < 0) runningIdx = 0;
    }
  }

  container.innerHTML = taskList.map((t, i) => {
    let status = 'pending';
    if (job.status === 'succeeded') {
      status = 'done';
    } else if (job.status === 'failed' && i === runningIdx) {
      status = 'failed';
    } else if (job.running) {
      if (i < runningIdx) status = 'done';
      else if (i === runningIdx) status = 'running';
    }

    return `<div class="task-row ${rowClass(status)}">
      <span class="task-num">${i + 1}</span>
      <span class="task-status">${statusIcon(status)}</span>
      <span class="task-info">
        <div class="task-name">${t.name}</div>
        <div class="task-desc">${t.desc}</div>
      </span>
      ${status === 'done' ? '<span class="task-time">完成</span>' : ''}
      ${status === 'failed' ? '<span class="task-time">失败</span>' : ''}
      ${status === 'running' ? '<span class="task-time">执行中...</span>' : ''}
    </div>`;
  }).join('');
}

function renderProgress(job) {
  const wrap = $('progress-wrap');
  const bar = $('progress-bar');
  const pct = $('progress-pct');
  const label = $('progress-label');

  if (job.running) {
    wrap.classList.add('active');
    if (job.progress_total) {
      const idx = job.progress_index || 0;
      const total = job.progress_total || 1;
      const percent = Math.round((idx / total) * 100);
      bar.style.width = percent + '%';
      pct.textContent = percent + '%';
    } else {
      // Indeterminate: animated pulse
      bar.style.width = '30%';
      bar.style.animation = 'pulse 1.5s ease-in-out infinite';
      pct.textContent = '—';
    }
    label.textContent = job.current_progress_text || '正在执行...';
  } else if (job.status === 'succeeded') {
    wrap.classList.add('active');
    bar.style.width = '100%';
    bar.style.animation = '';
    pct.textContent = '100%';
    label.textContent = '全部完成';
  } else if (job.status === 'failed') {
    wrap.classList.remove('active');
    bar.style.animation = '';
  } else {
    wrap.classList.remove('active');
    bar.style.animation = '';
  }
}

function renderStatusLine(job) {
  const line = $('status-line');
  if (job.status === 'succeeded') {
    line.textContent = '✅ 数据更新全部完成';
    line.style.color = 'var(--accent)';
  } else if (job.status === 'failed') {
    line.textContent = '❌ 数据更新失败：' + (job.error || '未知错误');
    line.style.color = 'var(--danger)';
  } else if (job.running) {
    line.textContent = '🔄 ' + (job.current_progress_text || '正在更新...');
    line.style.color = 'var(--accent)';
  } else {
    line.textContent = '点击"启动更新"开始数据刷新';
    line.style.color = 'var(--muted)';
  }
}

function renderButtons(job) {
  const startBtn = $('btn-start');
  const retryBtn = $('btn-retry');
  const errorBanner = $('error-banner');

  if (job.running) {
    startBtn.textContent = '⏳ 更新中...';
    startBtn.disabled = true;
    retryBtn.hidden = true;
    errorBanner.classList.remove('active');
  } else if (job.status === 'succeeded') {
    startBtn.textContent = '✅ 已完成';
    startBtn.disabled = true;
    retryBtn.hidden = true;
    errorBanner.classList.remove('active');
    // Auto-reset after 5 seconds so user can run again
    if (!startBtn._succeededTimer) {
      startBtn._succeededTimer = setTimeout(() => {
        startBtn.textContent = '▶ 启动更新';
        startBtn.disabled = false;
        startBtn._succeededTimer = null;
      }, 5000);
    }
  } else if (job.can_retry_failed) {
    startBtn.textContent = '▶ 启动更新';
    startBtn.disabled = true;
    retryBtn.hidden = false;
    errorBanner.classList.add('active');
    errorBanner.textContent = job.error || '部分任务失败，可重试';
  } else if (job.status === 'failed') {
    startBtn.textContent = '▶ 启动更新';
    startBtn.disabled = false;
    retryBtn.hidden = true;
    errorBanner.classList.add('active');
    errorBanner.textContent = job.error || '更新失败';
  } else {
    startBtn.textContent = '▶ 启动更新';
    startBtn.disabled = false;
    retryBtn.hidden = true;
    errorBanner.classList.remove('active');
    errorBanner.textContent = '';
  }
}

function renderAll(data) {
  tasks = data.tasks || [];
  const job = data.job || {};
  const status = data.current_status || {};

  renderFreshness(status);
  renderTasks(tasks, job);
  renderProgress(job);
  renderStatusLine(job);
  renderButtons(job);

  running = job.running === true;
  currentJobStatus = job.status || 'idle';
}

// ── API ──
async function loadPlan() {
  try {
    const resp = await fetch('/api/data-update-plan');
    const data = await resp.json();
    if (data.ok) renderAll(data);
  } catch (err) {
    console.error('Failed to load plan:', err);
  }
}

async function startUpdate() {
  const btn = $('btn-start');
  btn.textContent = '⏳ 启动中...';
  btn.disabled = true;
  try {
    const resp = await fetch('/api/data-update-run', { method: 'POST' });
    const data = await resp.json();
    if (!data.ok) {
      if (data.error?.code === 'data_update_busy') {
        $('status-line').textContent = '🔄 已有更新任务在运行中，正在跟踪进度...';
        $('status-line').style.color = 'var(--accent)';
        startPolling();
        return;
      }
      throw new Error(data.error?.message || '启动失败');
    }
    await loadPlan();
    startPolling();
  } catch (err) {
    btn.textContent = '▶ 启动更新';
    btn.disabled = false;
    $('status-line').textContent = '❌ 启动失败: ' + err.message;
    $('status-line').style.color = 'var(--danger)';
    console.error('Failed to start update:', err);
  }
}

async function retryFailed() {
  try {
    const resp = await fetch('/api/data-update-retry', { method: 'POST' });
    await resp.json();
    await loadPlan();
  } catch (err) {
    console.error('Retry failed:', err);
  }
}

// ── Polling ──
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    await loadPlan();
    if (!running && currentJobStatus !== 'running') {
      stopPolling();
    }
  }, 2000);
}

function stopPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

// ── Init ──
$('btn-start').addEventListener('click', async () => {
  await startUpdate();
});

$('btn-retry').addEventListener('click', async () => {
  await retryFailed();
  startPolling();
});

// Initial load
loadPlan();

// If already running, start polling
setTimeout(() => {
  if (running) startPolling();
}, 500);
</script>
</body>
</html>
