<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据更新</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .update-shell {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .task-list {
      border: 1px solid rgba(124,224,195,0.15);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .task-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(124,224,195,0.06);
      transition: background 0.15s;
    }
    .task-row:last-child { border-bottom: none; }
    .task-row.running {
      background: rgba(124,224,195,0.08);
    }
    .task-row.done {
      opacity: 0.7;
    }
    .task-row.failed {
      background: rgba(255,107,107,0.06);
    }
    .task-status {
      width: 24px;
      text-align: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .task-num {
      width: 24px;
      text-align: right;
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .task-info {
      flex: 1;
      min-width: 0;
    }
    .task-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .task-title-line { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .task-freshness { font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .task-freshness.unknown { color: var(--muted); }
    .task-eta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .task-eta.forecast { color: var(--warning); }
    .task-running .task-name { color: var(--accent); }
    .task-done .task-name { color: var(--muted); }
    .task-failed .task-name { color: var(--danger); }
    .task-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .task-time {
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
      text-align: right;
    }

    .progress-bar-wrap {
      margin-bottom: 20px;
      display: none;
    }
    .progress-bar-wrap.active { display: block; }
    .progress-outer {
      height: 6px;
      background: rgba(124,224,195,0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-inner {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.5s ease;
      width: 0%;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .progress-text {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .action-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-start {
      padding: 10px 28px;
      border: 1px solid var(--accent);
      background: rgba(124,224,195,0.1);
      color: var(--accent);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .btn-start:hover { background: rgba(124,224,195,0.2); }
    .btn-start:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-retry {
      padding: 10px 20px;
      border: 1px solid rgba(255,193,7,0.3);
      background: rgba(255,193,7,0.08);
      color: var(--warning);
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .btn-retry:hover { background: rgba(255,193,7,0.15); }
    .btn-retry[hidden] { display: none; }
    .btn-task { padding:5px 10px; border:1px solid rgba(124,224,195,.35); border-radius:7px; background:transparent; color:var(--accent); cursor:pointer; font-size:11px; }.btn-task:disabled { opacity:.35; cursor:not-allowed; }

    .error-banner {
      padding: 12px 16px;
      border: 1px solid rgba(255,107,107,0.2);
      border-radius: 10px;
      background: rgba(255,107,107,0.06);
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .error-banner.active { display: block; }

    .status-line {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 12px;
      font-style: italic;
    }
    .sector-panel { margin:22px 0; border:1px solid rgba(139,216,255,.22); border-radius:10px; overflow:hidden; background:rgba(98,184,255,.025); }
    .sector-panel-head { padding:12px 14px; border-bottom:1px solid rgba(139,216,255,.14); }
    .sector-panel-head h2 { margin:0 0 5px; font-size:15px; }
    .sector-summary { color:var(--muted); font-size:11px; }
    .sector-filters { display:grid; grid-template-columns:140px 170px minmax(180px,1fr); gap:8px; padding:10px 14px; }
    .sector-filters select,.sector-filters input { min-width:0; padding:7px 9px; color:var(--text); background:#0b171e; border:1px solid rgba(139,216,255,.25); border-radius:7px; }
    .sector-table-wrap { max-height:440px; overflow:auto; }
    .sector-table { width:100%; border-collapse:collapse; font-size:11px; }
    .sector-table th,.sector-table td { padding:8px 9px; border-top:1px solid rgba(139,216,255,.09); text-align:left; white-space:nowrap; }
    .sector-table th { position:sticky; top:0; z-index:1; background:#0b171e; color:var(--muted); }
    .sector-status { font-weight:700; }.sector-status.ok { color:var(--accent); }.sector-status.failed { color:var(--danger); }.sector-status.pending { color:var(--warning); }
    .sector-error { max-width:220px; overflow:hidden; text-overflow:ellipsis; color:var(--danger); }
    .btn-symbol-retry { padding:4px 8px; border:1px solid rgba(255,193,7,.4); border-radius:6px; background:rgba(255,193,7,.07); color:var(--warning); cursor:pointer; font-size:10px; }
    .btn-symbol-retry:disabled { opacity:.35; cursor:not-allowed; }
    @media (max-width:760px) { .sector-filters { grid-template-columns:1fr; }.sector-table { min-width:900px; } }
  </style>
</head>
<body>
<main class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">DATA UPDATE TERMINAL</p>
      <h1>数据更新</h1>
    </div>
    <div class="topbar-actions" id="global-nav"></div>
  </header>

  <div class="update-shell">
    <!-- Error banner -->
    <div class="error-banner" id="error-banner"></div>

    <!-- Progress -->
    <div class="progress-bar-wrap" id="progress-wrap">
      <div class="progress-outer">
        <div class="progress-inner" id="progress-bar"></div>
      </div>
      <div class="progress-text">
        <span id="progress-label">正在准备...</span>
        <span id="progress-pct">0%</span>
      </div>
    </div>

    <!-- Status line -->
    <div class="status-line" id="status-line">点击"启动更新"开始数据刷新</div>

    <!-- Task list -->
    <div class="task-list" id="task-list"></div>

    <section class="sector-panel" aria-labelledby="sector-update-title">
      <div class="sector-panel-head"><h2 id="sector-update-title">银行 / 证券外部财报逐股状态</h2><div class="sector-summary" id="sector-summary">正在加载90只股票状态…</div></div>
      <div class="sector-filters">
        <select id="sector-filter"><option value="">全部模型</option><option value="bank">银行</option><option value="securities">证券</option></select>
        <select id="sector-status-filter"><option value="">全部状态</option><option value="up_to_date">已是最新</option><option value="pending">尚未更新</option><option value="queued">等待处理</option><option value="processing">处理中</option><option value="insufficient_evidence">证据不足</option><option value="download_failed">下载失败</option><option value="parse_failed">解析失败</option><option value="validation_failed">校验失败</option><option value="failed">失败</option></select>
        <input id="sector-query" type="search" placeholder="按代码或名称筛选">
      </div>
      <div class="sector-table-wrap"><table class="sector-table"><thead><tr><th>股票</th><th>模型</th><th>最新公告期</th><th>最新有效期</th><th>最近可信计分期</th><th>年度分</th><th>当前季报分</th><th>上一可信季报</th><th>状态</th><th>错误</th><th>操作</th></tr></thead><tbody id="sector-status-body"><tr><td colspan="11">正在加载…</td></tr></tbody></table></div>
    </section>

    <!-- Actions -->
    <div class="action-bar">
      <button class="btn-start" id="btn-start" type="button">▶ 启动更新</button>
      <button class="btn-retry" id="btn-retry" type="button" hidden>↻ 重试失败项</button>
    </div>
  </div>
</main>

<script src="/nav.js"></script>
<script>
// ── State ──
let tasks = [];
let running = false;
let pollTimer = null;
let currentJobStatus = 'idle';
let sectorRows = [];
let sectorSummary = {};
let sectorPollTimer = null;

// ── Helpers ──
const $ = (id) => document.getElementById(id);

function statusIcon(taskStatus) {
  switch (taskStatus) {
    case 'running': return '🔄';
    case 'done': return '✅';
    case 'failed': return '❌';
    default: return '⏳';
  }
}

function rowClass(taskStatus) {
  switch (taskStatus) {
    case 'running': return 'task-running';
    case 'done': return 'task-done';
    case 'failed': return 'task-failed';
    default: return '';
  }
}

function formatEta(t, job) {
  const eta = t.estimated_completion || {};
  if (eta.finish_at) {
    const date = new Date(eta.finish_at);
    if (!Number.isNaN(date.getTime())) {
      const parts = new Intl.DateTimeFormat('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false,
      }).format(date);
      return { text: `预计完成：${parts}（估算）`, forecast: true };
    }
  }
  if (eta.state === 'overdue') return { text: '预计完成：已超出历史耗时，待确认', forecast: false };
  if (eta.state === 'failed') return { text: '预计完成：任务失败，无法估时', forecast: false };
  if (eta.state === 'done') return { text: '预计完成：已完成', forecast: false };
  if (eta.state === 'no_history' || (eta.state === 'not_started' && !eta.samples)) {
    return { text: '预计完成：暂无历史耗时', forecast: false };
  }
  if (eta.state === 'not_started' && job.running) return {
    text: '预计完成：待前序任务完成', forecast: false,
  };
  if (eta.state === 'not_started') return {
    text: `预计完成：启动后计算（历史约 ${Math.max(1, Math.round(eta.duration_seconds / 60))} 分钟）`,
    forecast: false,
  };
  return { text: '预计完成：待前序任务完成', forecast: false };
}

// ── Render ──
function renderTasks(taskList, job) {
  const container = $('task-list');
  const currentStep = job.current_step || '';

  // Map job step names from pipeline (e.g., 'rebuild_screener_first') to task ids
  const stepMap = {
    'archive_daily': 'archive_daily',
    'update_financial_ts': 'update_financial_ts',
    'build_financial_snapshot': 'build_financial_snapshot',
    'build_industry_metric_snapshot': 'build_industry_metric_snapshot',
    'build_industry_relative_valuation_snapshot': 'build_industry_relative_valuation_snapshot',
    'build_rps_history': 'build_rps_history',
    'update_rps_current': 'update_rps_current',
    'rebuild_screener_ma_cross': 'rebuild_screener_ma_cross',
    'rebuild_screener_washout': 'rebuild_screener_washout',
    'rebuild_screener_rps_climb': 'rebuild_screener_rps_climb',
    'rebuild_screener_blowup_stall': 'rebuild_screener_blowup_stall',
    'rebuild_screener_blowup_break': 'rebuild_screener_blowup_break',
  };
  const currentTaskId = stepMap[currentStep] || currentStep;

  let runningIdx = -1;
  if (job.running) {
    if (currentTaskId && currentTaskId !== 'init') {
      runningIdx = taskList.findIndex(t => t.id === currentTaskId);
    }
    // If 'init' or not mapped, highlight the first pending task
    if (runningIdx < 0) {
      runningIdx = taskList.findIndex((t, i) => {
        // First task that isn't done (in case of retry)
        return true;
      });
      if (runningIdx < 0) runningIdx = 0;
    }
  }

  const taskStates = job.task_states || {};
  container.innerHTML = taskList.map((t, i) => {
    const recorded = taskStates[t.id] || {};
    let status = recorded.status || 'pending';
    // Legacy/full-pipeline fallback only while an older job lacks task records.
    if (!recorded.status && job.running && i === runningIdx) status = 'running';
    if (!recorded.status && job.running && i < runningIdx && job.mode !== 'single_task' && !t.id.startsWith('build_good_stock_')) status = 'done';
    const eta = formatEta(t, job);
    const etaBasis = t.estimated_completion?.samples
      ? `近 ${t.estimated_completion.samples} 次成功运行耗时中位数；仅供参考，受数据量和机器负载影响`
      : '暂无该任务成功运行的耗时样本；不使用超时阈值冒充估算';

    return `<div class="task-row ${rowClass(status)}">
      <span class="task-num">${i + 1}</span>
      <span class="task-status">${statusIcon(status)}</span>
      <span class="task-info">
        <div class="task-title-line"><span class="task-name">${t.name}</span><span class="task-freshness${t.data_freshness?.data_date ? '' : ' unknown'}">${t.data_freshness?.data_date ? `${t.data_freshness.label} ${t.data_freshness.data_date}` : '数据日期未知'}</span><span class="task-eta${eta.forecast ? ' forecast' : ''}" title="${etaBasis}">${eta.text}</span></div>
        <div class="task-desc">${t.desc}</div>
      </span>
      ${status === 'done' ? '<span class="task-time">完成</span>' : ''}
      ${status === 'failed' ? '<span class="task-time">失败</span>' : ''}
      ${status === 'running' ? '<span class="task-time">执行中...</span>' : ''}
      <button class="btn-task" type="button" data-task-id="${t.id}" ${job.running || t.skipped ? 'disabled' : ''}>${status === 'failed' ? '重试' : '执行'}</button>
    </div>`;
  }).join('');
}

function renderProgress(job) {
  const wrap = $('progress-wrap');
  const bar = $('progress-bar');
  const pct = $('progress-pct');
  const label = $('progress-label');

  if (job.running) {
    wrap.classList.add('active');
    if (job.progress_total) {
      const idx = job.progress_index || 0;
      const total = job.progress_total || 1;
      const percent = Math.round((idx / total) * 100);
      bar.style.animation = '';
      bar.style.width = percent + '%';
      pct.textContent = percent + '%';
    } else {
      // Indeterminate: animated pulse
      bar.style.width = '30%';
      bar.style.animation = 'pulse 1.5s ease-in-out infinite';
      pct.textContent = '—';
    }
    label.textContent = job.current_progress_text || '正在执行...';
  } else if (job.status === 'succeeded') {
    wrap.classList.add('active');
    bar.style.width = '100%';
    bar.style.animation = '';
    pct.textContent = '100%';
    label.textContent = job.mode === 'single_task' ? '本项更新完成' : '常规更新完成';
  } else if (job.status === 'failed') {
    wrap.classList.remove('active');
    bar.style.animation = '';
  } else {
    wrap.classList.remove('active');
    bar.style.animation = '';
  }
}

function renderStatusLine(job) {
  const line = $('status-line');
  if (job.status === 'succeeded') {
    line.textContent = job.mode === 'single_task' ? '✅ 本项数据更新完成，其他任务未被执行' : '✅ 常规数据更新完成';
    line.style.color = 'var(--accent)';
  } else if (job.status === 'failed') {
    line.textContent = '❌ 数据更新失败：' + (job.error || '未知错误');
    line.style.color = 'var(--danger)';
  } else if (job.running) {
    line.textContent = '🔄 ' + (job.current_progress_text || '正在更新...');
    line.style.color = 'var(--accent)';
  } else {
    line.textContent = '点击"启动更新"开始数据刷新';
    line.style.color = 'var(--muted)';
  }
}

function renderButtons(job) {
  const startBtn = $('btn-start');
  const retryBtn = $('btn-retry');
  const errorBanner = $('error-banner');

  if (job.running) {
    startBtn.textContent = '⏳ 更新中...';
    startBtn.disabled = true;
    retryBtn.hidden = true;
    errorBanner.classList.remove('active');
  } else if (job.can_retry_failed) {
    startBtn.textContent = '▶ 启动更新';
    startBtn.disabled = job.mode !== 'single_task';
    retryBtn.hidden = false;
    errorBanner.classList.add('active');
    errorBanner.textContent = job.error || '部分任务失败，可重试';
  } else if (job.status === 'succeeded') {
    startBtn.textContent = '✅ 已完成';
    startBtn.disabled = true;
    retryBtn.hidden = true;
    errorBanner.classList.remove('active');
    // Auto-reset after 5 seconds so user can run again
    if (!startBtn._succeededTimer) {
      startBtn._succeededTimer = setTimeout(() => {
        startBtn.textContent = '▶ 启动更新';
        startBtn.disabled = false;
        startBtn._succeededTimer = null;
      }, 5000);
    }
  } else if (job.status === 'failed') {
    startBtn.textContent = '▶ 启动更新';
    startBtn.disabled = false;
    retryBtn.hidden = true;
    errorBanner.classList.add('active');
    errorBanner.textContent = job.error || '更新失败';
  } else {
    startBtn.textContent = '▶ 启动更新';
    startBtn.disabled = false;
    retryBtn.hidden = true;
    errorBanner.classList.remove('active');
    errorBanner.textContent = '';
  }
}

function renderAll(data) {
  tasks = data.tasks || [];
  const job = data.job || {};
  renderTasks(tasks, job);
  renderProgress(job);
  renderStatusLine(job);
  renderButtons(job);

  running = job.running === true;
  currentJobStatus = job.status || 'idle';
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

const SECTOR_STATUS_LABELS = {
  up_to_date:'已是最新', pending:'尚未更新', queued:'等待处理', processing:'处理中',
  insufficient_evidence:'证据不足', download_failed:'下载失败', parse_failed:'解析失败',
  validation_failed:'校验失败', publish_failed:'发布失败', failed:'失败',
};

function renderSectorStatus() {
  const sector = $('sector-filter').value;
  const status = $('sector-status-filter').value;
  const query = $('sector-query').value.trim().toLowerCase();
  const rows = sectorRows.filter(row => (!sector || row.sector_model === sector)
    && (!status || row.status === status)
    && (!query || String(row.symbol || '').includes(query) || String(row.name || '').toLowerCase().includes(query)));
  const counts = sectorSummary.status_counts || {};
  $('sector-summary').textContent = `共 ${sectorSummary.total ?? 90} 只｜已最新 ${counts.up_to_date || 0}｜处理中 ${(counts.queued || 0) + (counts.processing || 0)}｜失败 ${Object.entries(counts).filter(([key]) => key.endsWith('_failed') || key === 'failed').reduce((sum,[,value]) => sum + Number(value || 0), 0)}｜证据不足 ${counts.insufficient_evidence || 0}｜尚未更新 ${sectorSummary.missing_status_count || 0}｜最新公告期 ${sectorSummary.latest_announced_period || '未知'}`;
  $('sector-status-body').innerHTML = rows.length ? rows.map(row => {
    const state = row.status || 'pending';
    const stateClass = state === 'up_to_date' ? 'ok' : state === 'queued' || state === 'processing' ? 'pending' : state === 'pending' ? 'pending' : 'failed';
    const error = row.last_error?.message || row.last_error || '';
    const busy = state === 'queued' || state === 'processing';
    const model = row.sector_model === 'bank' ? '银行模型' : row.sector_model === 'securities' ? '证券模型' : '—';
    const previous = row.previous_quarterly_score == null ? '—' : `${escapeHtml(row.previous_quarterly_score)}｜${escapeHtml(row.previous_quarterly_period || '—')}`;
    return `<tr data-symbol="${escapeHtml(row.symbol)}"><td>${escapeHtml(row.symbol)} ${escapeHtml(row.name)}</td><td>${model}</td><td>${escapeHtml(row.latest_announced_period || '—')}</td><td>${escapeHtml(row.latest_valid_period || '—')}</td><td>${escapeHtml(row.latest_scored_period || '—')}</td><td>${row.annual_score == null ? '—' : escapeHtml(row.annual_score)}</td><td>${row.quarterly_score == null ? '—' : escapeHtml(row.quarterly_score)}</td><td>${previous}</td><td class="sector-status ${stateClass}">${escapeHtml(SECTOR_STATUS_LABELS[state] || state)}</td><td class="sector-error" title="${escapeHtml(error)}">${escapeHtml(error || '—')}</td><td><button class="btn-symbol-retry" type="button" data-symbol-retry="${escapeHtml(row.symbol)}" ${busy ? 'disabled' : ''}>${busy ? '处理中' : '重试'}</button></td></tr>`;
  }).join('') : '<tr><td colspan="11">没有符合条件的股票。</td></tr>';
}

async function loadFinancialSectorStatus() {
  try {
    const resp = await fetch('/api/financial-sector-update-status');
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error?.message || '状态加载失败');
    sectorRows = data.stocks || [];
    sectorSummary = data.summary || {};
    renderSectorStatus();
  } catch (err) {
    $('sector-summary').textContent = `逐股状态加载失败：${err.message}`;
  }
}

async function retryFinancialSectorSymbol(symbol) {
  const row = sectorRows.find(item => item.symbol === symbol) || {};
  const resp = await fetch('/api/financial-sector-update-retry', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({symbol, report_period:row.latest_announced_period || '', source_type:''}),
  });
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error?.message || '单股重试启动失败');
  await loadFinancialSectorStatus();
  if (!sectorPollTimer) {
    let ticks = 0;
    sectorPollTimer = setInterval(async () => {
      await loadFinancialSectorStatus();
      ticks += 1;
      if (ticks >= 150 || !sectorRows.some(item => ['queued','processing'].includes(item.status))) {
        clearInterval(sectorPollTimer); sectorPollTimer = null;
      }
    }, 2000);
  }
}

// ── API ──
async function loadPlan() {
  try {
    const resp = await fetch('/api/data-update-plan');
    const data = await resp.json();
    if (data.ok) {
      renderAll(data);
      await loadFinancialSectorStatus();
    }
  } catch (err) {
    console.error('Failed to load plan:', err);
  }
}

async function startUpdate() {
  const btn = $('btn-start');
  btn.textContent = '⏳ 启动中...';
  btn.disabled = true;
  try {
    const resp = await fetch('/api/data-update-run', { method: 'POST' });
    const data = await resp.json();
    if (!data.ok) {
      if (data.error?.code === 'data_update_busy') {
        $('status-line').textContent = '🔄 已有更新任务在运行中，正在跟踪进度...';
        $('status-line').style.color = 'var(--accent)';
        startPolling();
        return;
      }
      throw new Error(data.error?.message || '启动失败');
    }
    await loadPlan();
    startPolling();
  } catch (err) {
    btn.textContent = '▶ 启动更新';
    btn.disabled = false;
    $('status-line').textContent = '❌ 启动失败: ' + err.message;
    $('status-line').style.color = 'var(--danger)';
    console.error('Failed to start update:', err);
  }
}

async function retryFailed() {
  try {
    const resp = await fetch('/api/data-update-retry', { method: 'POST' });
    await resp.json();
    await loadPlan();
  } catch (err) {
    console.error('Retry failed:', err);
  }
}

async function runTask(taskId) {
  const resp = await fetch('/api/data-update-task', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({task_id:taskId})});
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error?.message || '任务启动失败');
  await loadPlan(); startPolling();
}

// ── Polling ──
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    await loadPlan();
    if (!running && currentJobStatus !== 'running') {
      stopPolling();
    }
  }, 2000);
}

function stopPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

// ── Init ──
$('btn-start').addEventListener('click', async () => {
  await startUpdate();
});

$('btn-retry').addEventListener('click', async () => {
  await retryFailed();
  startPolling();
});
$('task-list').addEventListener('click', async (event) => {
  const button = event.target.closest('.btn-task');
  if (!button || button.disabled) return;
  button.disabled = true;
  try { await runTask(button.dataset.taskId); }
  catch (err) { $('status-line').textContent = '❌ 单任务启动失败: ' + err.message; $('status-line').style.color = 'var(--danger)'; button.disabled = false; }
});
['sector-filter','sector-status-filter'].forEach(id => $(id).addEventListener('change', renderSectorStatus));
$('sector-query').addEventListener('input', renderSectorStatus);
$('sector-status-body').addEventListener('click', async (event) => {
  const button = event.target.closest('[data-symbol-retry]');
  if (!button || button.disabled) return;
  button.disabled = true;
  try { await retryFinancialSectorSymbol(button.dataset.symbolRetry); }
  catch (err) { $('sector-summary').textContent = `单股重试失败：${err.message}`; button.disabled = false; }
});

// Initial load
loadPlan();

// If already running, start polling
setTimeout(() => {
  if (running) startPolling();
}, 500);
</script>
</body>
</html>
