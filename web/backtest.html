<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>选股回测</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .backtest-config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .backtest-config-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .backtest-config-group label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .backtest-config-group input,
    .backtest-config-group select {
      padding: 10px 12px;
      border: 1px solid rgba(124, 224, 195, 0.2);
      border-radius: 10px;
      background: rgba(7, 16, 24, 0.9);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
    }
    .backtest-config-group input:focus,
    .backtest-config-group select:focus {
      outline: none;
      border-color: rgba(124, 224, 195, 0.5);
      box-shadow: 0 0 0 2px rgba(124, 224, 195, 0.08);
    }
    .backtest-config-group select {
      cursor: pointer;
    }
    .backtest-config-group input[type="number"] {
      width: 100%;
    }
    .backtest-exit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .backtest-config-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }
    .backtest-run-btn {
      padding: 12px 28px !important;
      font-size: 14px !important;
      font-weight: 600;
      background: linear-gradient(135deg, rgba(0, 230, 118, 0.28), rgba(0, 200, 83, 0.22)) !important;
      border: 1px solid rgba(0, 230, 118, 0.4) !important;
      color: var(--green) !important;
      border-radius: 10px !important;
      cursor: pointer;
      transition: all 0.2s;
    }
    .backtest-run-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(0, 230, 118, 0.4), rgba(0, 200, 83, 0.32)) !important;
      border-color: rgba(0, 230, 118, 0.6) !important;
    }
    .backtest-run-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .backtest-loading {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      margin: 14px 0;
      border: 1px solid rgba(124, 224, 195, 0.16);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(16, 31, 45, 0.96), rgba(10, 20, 29, 0.96));
    }
    .backtest-loading.active {
      display: flex;
    }
    .backtest-loading .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(124, 224, 195, 0.18);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .backtest-error {
      display: none;
      padding: 14px 18px;
      margin: 14px 0;
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 12px;
      background: rgba(255, 107, 107, 0.08);
      color: var(--danger);
      font-size: 13px;
    }
    .backtest-error.active {
      display: block;
    }
    .backtest-results-section {
      display: none;
    }
    .backtest-results-section.active {
      display: block;
    }
    #backtest-summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    #backtest-summary .metric-card {
      min-width: 130px;
    }
  </style>
</head>
<body>
<main class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">BACKTEST TERMINAL</p>
      <h1>选股回测</h1>
    </div>
    <div class="topbar-actions">
      <a href="/stock-score.html" class="nav-link">财务评分</a>
      <a href="/stock-screener.html" class="nav-link">股票筛选</a>
      <a href="/realtime-screener.html" class="nav-link">实时选股</a>
      <a href="/rps-pool.html" class="nav-link">RPS</a>
      <a href="/backtest.html" class="nav-link active">回测</a>
    </div>
  </header>

  <!-- Config Form -->
  <article class="search-card">
    <div class="search-card-header">
      <div>
        <p class="eyebrow">BACKTEST CONFIG</p>
        <h2>回测配置</h2>
      </div>
      <p class="search-meta">设置参数后点击"运行回测"，请求可能需要1-5分钟</p>
    </div>
    <form id="backtest-form" onsubmit="return false;">
      <div class="backtest-config-grid">
        <div class="backtest-config-group">
          <label>起始日期</label>
          <input type="date" id="bt-start" name="start_date" required value="2025-01-02">
        </div>
        <div class="backtest-config-group">
          <label>结束日期</label>
          <input type="date" id="bt-end" name="end_date" required value="2026-05-23">
        </div>
        <div class="backtest-config-group">
          <label>策略</label>
          <select id="bt-strategy" name="strategy">
            <option value="">-- 自定义 / 无策略 --</option>
            <option value="rps_standard_launch">RPS标准启动</option>
            <option value="rps_attack">RPS进攻</option>
            <option value="rps_pullback">RPS回踩</option>
            <option value="rps_first">RPS首次</option>
            <option value="rps_climb">RPS爬升</option>
            <option value="ma_cross">均线选股</option>
            <option value="first_board">首板股池</option>
            <option value="washout">涨停洗盘</option>
            <option value="blowup_stall">爆量滞涨</option>
          </select>
        </div>
        <div class="backtest-config-group">
          <label>最大持仓数</label>
          <input type="number" id="bt-max-holdings" name="max_holdings" value="10" min="1" max="50">
        </div>
      </div>
      <div class="backtest-exit-grid">
        <div class="backtest-config-group">
          <label>止损 (%)</label>
          <input type="number" id="bt-stop-loss" name="stop_loss_pct" value="-8" step="1">
        </div>
        <div class="backtest-config-group">
          <label>止盈 (%)</label>
          <input type="number" id="bt-take-profit" name="take_profit_pct" value="20" step="1">
        </div>
        <div class="backtest-config-group">
          <label>均线周期（0=禁用）</label>
          <input type="number" id="bt-ma" name="ma_period" value="0" min="0">
        </div>
        <div class="backtest-config-group">
          <label>回撤 %（0=禁用）</label>
          <input type="number" id="bt-trailing" name="trailing_pct" value="0" min="0" step="1">
        </div>
        <div class="backtest-config-group">
          <label>最长持仓天</label>
          <input type="number" id="bt-max-hold" name="max_hold_days" value="20" min="1">
        </div>
      </div>
      <div class="backtest-config-actions" style="margin-top:14px">
        <button type="submit" id="bt-run-btn" class="backtest-run-btn">运行回测</button>
        <span id="bt-status" class="search-meta"></span>
      </div>
    </form>
  </article>

  <!-- Loading -->
  <div id="bt-loading" class="backtest-loading">
    <div class="spinner"></div>
    <span>回测运行中，请耐心等待（通常需要 1-5 分钟）...</span>
  </div>

  <!-- Error -->
  <div id="bt-error" class="backtest-error"></div>

  <!-- Results Section -->
  <div id="bt-results" class="backtest-results-section">
    <div id="backtest-config" class="profile-meta muted" style="margin-bottom:12px"></div>

    <section class="metrics" id="backtest-summary"></section>

    <div class="backtest-charts-row">
      <article class="search-card backtest-chart-card">
        <div class="search-card-header">
          <p class="eyebrow">EXIT REASONS</p>
          <h2>退出原因</h2>
        </div>
        <svg id="exit-pie" viewBox="0 0 200 200" width="200" height="200"></svg>
        <div id="exit-legend" class="backtest-chart-legend"></div>
      </article>
      <article class="search-card backtest-chart-card">
        <div class="search-card-header">
          <p class="eyebrow">RETURN DISTRIBUTION</p>
          <h2>收益分布</h2>
        </div>
        <svg id="return-hist" viewBox="0 0 460 200" preserveAspectRatio="xMidYMid meet"></svg>
      </article>
    </div>

    <article class="search-card" style="margin-top:14px">
      <div class="search-card-header">
        <p class="eyebrow">TRADE DETAILS</p>
        <h2>逐笔明细 <span id="trade-count" class="pool-badge">0</span></h2>
      </div>
      <div class="stock-screener-results-wrap">
        <table class="sub-table" id="trades-table">
          <thead><tr>
            <th>股票</th><th>信号日</th><th>买入日</th><th>买入价</th>
            <th>卖出日</th><th>卖出价</th><th>收益</th><th>持仓天</th><th>退出</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </article>
  </div>
</main>
<script src="/backtest.js"></script>
</body>
</html>
