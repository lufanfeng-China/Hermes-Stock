<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自选股</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .watchlist-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .watchlist-toolbar .count-badge {
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(124, 224, 195, 0.12);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }
    .watchlist-table-wrap {
      overflow-x: auto;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      border: 1px solid rgba(124, 224, 195, 0.12);
      border-radius: 10px;
    }
    #watchlist-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      white-space: nowrap;
    }
    #watchlist-table thead {
      position: sticky;
      top: 0;
      z-index: 1;
    }
    #watchlist-table th {
      padding: 8px 10px;
      text-align: left;
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(7, 16, 24, 0.98);
      border-bottom: 1px solid rgba(124, 224, 195, 0.16);
    }
    #watchlist-table th.num { text-align: right; }
    #watchlist-table td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(124, 224, 195, 0.06);
      color: var(--text);
      vertical-align: middle;
    }
    #watchlist-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    #watchlist-table tbody tr {
      cursor: pointer;
      transition: background 0.12s;
    }
    #watchlist-table tbody tr:hover {
      background: rgba(124, 224, 195, 0.05);
    }
    .wl-stock-name {
      font-weight: 600;
      color: var(--text);
    }
    .wl-stock-symbol {
      font-size: 10px;
      color: var(--muted);
    }
    .wl-name-cell {
      cursor: pointer;
    }
    .wl-name-cell:hover .wl-stock-name {
      color: var(--accent);
      text-decoration: underline;
    }
    .wl-price-cell {
      cursor: pointer;
    }
    .wl-price-cell:hover {
      color: var(--accent);
    }
    .wl-score {
      font-weight: 600;
    }
    .wl-rank {
      font-size: 10px;
      color: var(--muted);
    }
    .wl-remove-btn {
      background: none;
      border: 1px solid rgba(255, 107, 107, 0.2);
      color: var(--red);
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      transition: all 0.15s;
    }
    .wl-remove-btn:hover {
      background: rgba(255, 107, 107, 0.12);
      border-color: rgba(255, 107, 107, 0.4);
    }
    .wl-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .wl-empty-icon { font-size: 40px; margin-bottom: 12px; }
    .wl-empty-link {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 24px;
      border: 1px solid rgba(124, 224, 195, 0.3);
      border-radius: 10px;
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      transition: all 0.15s;
    }
    .wl-empty-link:hover {
      background: rgba(124, 224, 195, 0.08);
      border-color: rgba(124, 224, 195, 0.5);
    }
    .wl-loading {
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }

    /* K-line dialog */
    #kline-dialog[open] {
      display: flex;
      flex-direction: column;
      width: 95vw;
      max-width: 1100px;
      height: 85vh;
      max-height: 90vh;
      border: 1px solid rgba(124, 224, 195, 0.2);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(7, 16, 24, 0.99), rgba(10, 20, 29, 0.99));
      color: var(--text);
      padding: 0;
      overflow: hidden;
    }
    #kline-dialog {
      width: 95vw;
      max-width: 1100px;
      height: 85vh;
      max-height: 90vh;
      border: 1px solid rgba(124, 224, 195, 0.2);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(7, 16, 24, 0.99), rgba(10, 20, 29, 0.99));
      color: var(--text);
      padding: 0;
      overflow: hidden;
    }
    #kline-dialog::backdrop {
      background: rgba(0, 0, 0, 0.7);
    }
    #kline-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(124, 224, 195, 0.12);
    }
    #kline-dialog-header h2 {
      margin: 0;
      font-size: 15px;
    }
    #kline-dialog-close {
      background: none;
      border: 1px solid rgba(124, 224, 195, 0.2);
      color: var(--text);
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
    #kline-dialog-close:hover {
      background: rgba(124, 224, 195, 0.08);
    }
    #kline-container {
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }
    .wl-evidence-date { display:block; font-size:10px; color:var(--muted); margin-top:3px; }
    .wl-evidence-btn { background:none; border:0; padding:0; color:var(--accent); cursor:pointer; font:inherit; }
    .wl-evidence-btn:hover { text-decoration:underline; }
    #watchlist-table td.wl-swing-cell { min-width:185px; white-space:normal; }
    .wl-chart-dialog { width:min(1000px,94vw); max-width:94vw; max-height:90vh; overflow:auto;
      border:1px solid rgba(124,224,195,.3); border-radius:12px; padding:20px; color:var(--text); background:#0b1922; }
    .wl-chart-dialog::backdrop { background:rgba(0,0,0,.7); }
    .wl-chart-dialog .wl-close { float:right; background:transparent; border:1px solid var(--muted); color:var(--text); cursor:pointer; padding:6px 12px; }
    .wl-chart-dialog svg { display:block; width:100%; }
    #turnover-trend-svg { height:auto; }
    .turnover-trend-plot { position:relative; }
    .turnover-trend-tooltip { position:absolute; background:#071018; border:1px solid var(--accent); padding:6px; white-space:pre-line; pointer-events:none; font-size:11px; z-index:2; }
    #swing-chart-svg { height:520px; }
    #swing-chart-macd { height:176px; }
    .price-trend-controls { display:flex; gap:8px; margin:10px 0; }
    .price-trend-controls button { cursor:pointer; background:transparent; color:var(--text); border:1px solid var(--muted); padding:5px 10px; }
    .price-trend-controls button.is-active { color:var(--accent); border-color:var(--accent); }
  </style>
</head>
<body>
<main class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">WATCHLIST</p>
      <h1>自选股 <span id="wl-count" class="count-badge" style="display:none">0</span></h1>
    </div>
    <div class="topbar-actions" id="global-nav"></div>
  </header>

  <div id="wl-loading" class="wl-loading">加载中...</div>

  <div id="wl-empty" class="wl-empty" style="display:none">
    <div class="wl-empty-icon">📋</div>
    <p>自选股清单为空</p>
    <p style="font-size:12px;color:var(--muted)">前往股票筛选页面，勾选感兴趣的股票，然后点击「加入自选」即可在此查看</p>
    <a href="/stock-analysis.html" class="wl-empty-link">前往股票分析</a>
  </div>

  <div id="wl-content" style="display:none">
    <div class="watchlist-toolbar">
      <label class="wl-select-all-label"><input type="checkbox" id="wl-select-all"> 全选</label>
      <button id="wl-refresh-btn" class="nav-link" type="button">刷新</button>
      <button id="wl-sync-tdx-btn" class="nav-link" type="button">同步到AI股池</button>
      <button id="wl-clear-btn" class="nav-link" type="button" style="color:var(--danger);border-color:rgba(255,107,107,0.2)">清空全部</button>
      <span id="wl-status" class="search-meta"></span>
    </div>
    <div id="wl-overall" class="wl-overall" style="display:none;padding:8px 12px;margin-bottom:4px;font-size:13px;border-radius:4px;background:var(--card-bg);border:1px solid var(--border)"></div>
    <span id="wl-final-overall" style="display:none;padding:8px 12px;margin-bottom:4px;font-size:13px;border-radius:4px;background:var(--card-bg);border:1px solid var(--border)"></span>
    <div class="watchlist-table-wrap">
      <table id="watchlist-table">
        <thead><tr>
          <th></th>
          <th>股票</th>
          <th class="num">现价</th>
          <th class="num">10MA距离</th>
          <th class="num">30斜率</th>
          <th class="num">当前收益</th>
          <th class="num">最大收益</th>
          <th class="num">最大损失</th>
          <th>加入日期</th>
          <th>行业</th>
          <th class="num">PE分位</th>
          <th class="num">换手分位</th>
          <th>相对大盘强弱</th>
          <th>波峰波谷结构</th>
          <th>操作</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <dialog id="kline-dialog">
    <div id="kline-dialog-header">
      <h2 id="kline-dialog-title">K线图</h2>
      <button id="kline-dialog-close" type="button">关闭</button>
    </div>
    <div id="kline-container" class="kline-chart-body">
      <svg id="kline-chart-svg-wl" class="kline-chart-svg" role="img" aria-label="K线趋势图"></svg>
    </div>
  </dialog>
  <dialog id="turnover-trend-dialog" class="wl-chart-dialog" aria-labelledby="turnover-trend-title">
    <button type="button" class="wl-close turnover-trend-close">关闭 ×</button>
    <h2 id="turnover-trend-title">7日截尾均值换手历史分位</h2>
    <p id="turnover-trend-status" role="status"></p>
    <div class="turnover-trend-plot" hidden><svg id="turnover-trend-svg" viewBox="0 0 820 300" role="img" aria-label="截至表格日期近一年换手历史分位"></svg><div id="turnover-trend-tooltip" class="turnover-trend-tooltip" role="status" hidden></div></div>
    <p>横轴日期，纵轴历史分位；缺失日不插值。悬停或聚焦数据点查看样本。</p>
  </dialog>
  <dialog id="swing-chart-dialog" class="wl-chart-dialog" aria-labelledby="swing-chart-title">
    <button type="button" class="wl-close swing-chart-close">关闭 ×</button>
    <h2 id="swing-chart-title">波峰波谷 · 前复权K线与峰谷证据</h2>
    <p id="swing-chart-meta" role="status"></p>
    <div class="price-trend-controls" aria-label="图表区间"><button type="button" data-swing-window="20">20日</button><button type="button" data-swing-window="60">60日</button><button type="button" data-swing-window="120">120日</button><button type="button" data-swing-window="250">250日</button><button type="button" data-swing-window="-1">全部</button></div>
    <div class="swing-chart-scroll" hidden><svg id="swing-chart-svg" role="img" aria-label="前复权K线与峰谷"></svg><svg id="swing-chart-macd" role="img" aria-label="MACD走势"></svg></div>
    <p>实心峰谷为确认，虚线圈为候选；前复权K线、量与MACD来自当前有效日线，RPS缺失不补值。非实时行情或交易建议。</p>
  </dialog>
</main>
<script src="/nav.js"></script>
<script src="/swing-chart.js?v=20261116-wl1"></script>
<script src="/price-trend-chart.js?v=20261116-wl1"></script>
<script type="module" src="/watchlist.js?v=20261116-wl-columns-2"></script>
</body>
</html>
