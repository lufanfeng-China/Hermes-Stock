<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资金监控</title>
<link rel="stylesheet" href="/styles.css?v=20260512-capital-flow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>💰</text></svg>">
</head>
<body class="dark">

<main class="container">
  <header class="section-header">
    <p class="eyebrow">CAPITAL FLOW MONITOR</p>
    <h1>资金监控</h1>
    <nav class="nav-links">
      <a href="/" class="nav-link">财务评分</a>
      <a href="/stock-screener.html" class="nav-link">股票筛选</a>
      <a href="/realtime-screener.html" class="nav-link">实时选股</a>
      <a href="/capital-flow.html" class="nav-link active">资金监控</a>
    </nav>
  </header>

  <div class="capital-flow-controls">
    <button id="cf-refresh-btn" class="nav-link" type="button">刷新数据</button>
    <span id="cf-updated-at" class="search-meta"></span>
  </div>

  <section class="capital-flow-grid">
    <article class="search-card">
      <div class="search-card-header">
        <div>
          <p class="eyebrow">TOP INFLOW</p>
          <h2>主力净流入 TOP 20</h2>
        </div>
      </div>
      <div class="capital-flow-table-wrap">
        <table id="cf-inflow-table" class="stock-score-table">
          <thead>
            <tr>
              <th>#</th>
              <th>股票</th>
              <th class="num">现价</th>
              <th class="num">涨跌幅</th>
              <th class="num">主力净流入</th>
              <th class="num">主力占比</th>
              <th class="num">超大单</th>
              <th class="num">大单</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </article>

    <article class="search-card">
      <div class="search-card-header">
        <div>
          <p class="eyebrow">TOP OUTFLOW</p>
          <h2>主力净流出 TOP 20</h2>
        </div>
      </div>
      <div class="capital-flow-table-wrap">
        <table id="cf-outflow-table" class="stock-score-table">
          <thead>
            <tr>
              <th>#</th>
              <th>股票</th>
              <th class="num">现价</th>
              <th class="num">涨跌幅</th>
              <th class="num">主力净流出</th>
              <th class="num">主力占比</th>
              <th class="num">超大单</th>
              <th class="num">大单</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </article>

    <article class="search-card" style="grid-column: 1 / -1;">
      <div class="search-card-header">
        <div>
          <p class="eyebrow">FLOW HEATMAP</p>
          <h2>行业资金流向热力图</h2>
          <p class="search-meta">占位 — 待实现</p>
        </div>
      </div>
      <div id="cf-heatmap-placeholder" style="min-height:200px;display:flex;align-items:center;justify-content:center;color:var(--color-muted);">
        热力图区域
      </div>
    </article>
  </section>
</main>

<script>
const inflowTbody = document.getElementById('cf-inflow-table').querySelector('tbody');
const outflowTbody = document.getElementById('cf-outflow-table').querySelector('tbody');
const updatedAtEl = document.getElementById('cf-updated-at');
const refreshBtn = document.getElementById('cf-refresh-btn');

function formatYi(val) {
  if (val == null) return '—';
  const n = Number(val);
  const abs = Math.abs(n);
  if (abs >= 1e8) return (n / 1e8).toFixed(2) + '亿';
  if (abs >= 1e4) return (n / 1e4).toFixed(0) + '万';
  return n.toFixed(0);
}

function formatCap(val) {
  if (val == null) return '—';
  const n = Number(val);
  if (n >= 1e12) return (n / 1e12).toFixed(2) + '万亿';
  if (n >= 1e8) return (n / 1e8).toFixed(0) + '亿';
  return (n / 1e4).toFixed(0) + '万';
}

function renderTable(tbody, rows, isOutflow) {
  tbody.innerHTML = rows.map((r, i) => {
    const code = r.symbol || '';
    const name = r.name || code;
    const market = r.market || (code.startsWith('6') || code.startsWith('68') ? 'sh' : 'sz');
    const inflow = Number(r.main_inflow || 0);
    const color = inflow >= 0 ? 'var(--color-red, #ef5350)' : 'var(--color-green, #26a69a)';
    const sign = inflow >= 0 ? '+' : '';
    const rankColor = i < 3 ? 'color:var(--color-accent);font-weight:700' : '';
    return `<tr>
      <td style="${rankColor}">${i + 1}</td>
      <td><strong>${name}</strong><span class="stock-screener-symbol">${market.toUpperCase()}:${code}</span></td>
      <td class="num">${r.price != null ? Number(r.price).toFixed(2) : '—'}</td>
      <td class="num" style="color:${r.pct_chg != null && Number(r.pct_chg) >= 0 ? 'var(--color-red)' : 'var(--color-green)'}">${r.pct_chg != null ? (Number(r.pct_chg) >= 0 ? '+' : '') + Number(r.pct_chg).toFixed(2) + '%' : '—'}</td>
      <td class="num" style="color:${color}">${sign}${formatYi(inflow)}</td>
      <td class="num" style="color:${color}">${r.main_inflow_pct != null ? (Number(r.main_inflow_pct) >= 0 ? '+' : '') + Number(r.main_inflow_pct).toFixed(2) + '%' : '—'}</td>
      <td class="num">${formatYi(r.super_large_inflow)}</td>
      <td class="num">${formatYi(r.large_inflow)}</td>
    </tr>`;
  }).join('');
}

async function loadData() {
  inflowTbody.innerHTML = '<tr><td colspan="8">加载中...</td></tr>';
  outflowTbody.innerHTML = '<tr><td colspan="8">加载中...</td></tr>';
  try {
    const res = await fetch('/api/capital-flow-ranking');
    const data = await res.json();
    if (data.ok) {
      renderTable(inflowTbody, data.top_inflow || [], false);
      renderTable(outflowTbody, data.top_outflow || [], true);
      updatedAtEl.textContent = data.updated_at ? '更新于 ' + data.updated_at : '暂无数据';
    }
  } catch (e) {
    inflowTbody.innerHTML = '<tr><td colspan="8">加载失败</td></tr>';
    outflowTbody.innerHTML = '<tr><td colspan="8">加载失败</td></tr>';
  }
}

refreshBtn.addEventListener('click', async () => {
  refreshBtn.textContent = '刷新中...';
  refreshBtn.disabled = true;
  try {
    await fetch('/api/capital-flow-refresh', { method: 'POST' });
  } catch {}
  await loadData();
  refreshBtn.textContent = '刷新数据';
  refreshBtn.disabled = false;
});

loadData();
</script>
</body>
</html>
