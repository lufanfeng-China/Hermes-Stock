<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>财务评分 V2</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    :root {
      --score-green: #22c55e;
      --score-yellow: #f59e0b;
      --score-red: #ef4444;
      --score-cyan: #06b6d4;
    }
    .v2-shell { max-width: 1200px; margin: 0 auto; }

    /* Top bar */
    .v2-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0 20px;
    }
    .v2-topbar-left { display: flex; align-items: baseline; gap: 14px; }
    .v2-topbar-left h1 { font-size: 18px; font-weight: 600; margin: 0; }
    .v2-topbar-left .v2-symbol { font-size: 13px; color: var(--accent); font-family: 'SF Mono', 'Fira Code', monospace; }
    .v2-topbar-nav { display: flex; gap: 6px; }
    .v2-topbar-nav a {
      padding: 5px 14px; font-size: 12px; color: var(--muted); text-decoration: none;
      border-radius: 6px; border: 1px solid transparent; transition: all 0.15s;
    }
    .v2-topbar-nav a:hover { color: var(--text); border-color: rgba(124,224,195,0.20); }
    .v2-topbar-nav a.active { color: var(--accent); border-color: rgba(124,224,195,0.30); background: rgba(124,224,195,0.06); }

    /* Search */
    .v2-search-row {
      display: flex; gap: 0; margin-bottom: 24px;
      border: 1px solid rgba(124,224,195,0.18); border-radius: 10px; overflow: hidden;
      background: rgba(124,224,195,0.03); position: relative;
    }
    .v2-search-row:focus-within { border-color: rgba(124,224,195,0.40); }
    .v2-search-input {
      flex: 1; padding: 12px 16px; background: transparent; border: none;
      color: var(--text); font-size: 14px; font-family: inherit; outline: none;
    }
    .v2-search-input::placeholder { color: var(--muted); }
    .v2-search-dropdown {
      display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
      background: var(--bg-main); border: 1px solid rgba(124,224,195,0.18); border-top: none;
      border-radius: 0 0 10px 10px; max-height: 240px; overflow-y: auto;
    }
    .v2-search-dropdown.show { display: block; }
    .v2-search-item {
      padding: 8px 16px; cursor: pointer; font-size: 13px; border-bottom: 1px solid rgba(124,224,195,0.05);
    }
    .v2-search-item:hover, .v2-search-item.active { background: rgba(124,224,195,0.08); }

    /* Score row */
    .v2-score-row {
      display: flex; gap: 14px; margin-bottom: 14px;
    }
    .v2-score-card {
      flex: 1; padding: 16px; border-radius: 10px;
      border: 1px solid rgba(124,224,195,0.10);
      background: linear-gradient(135deg, rgba(124,224,195,0.03), rgba(124,224,195,0.01));
    }
    .v2-score-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .v2-score-value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
    .v2-score-rank { font-size: 12px; color: var(--accent); margin-top: 2px; }
    .v2-score-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* Tech row */
    .v2-tech-row {
      display: flex; gap: 10px; margin-bottom: 14px;
    }
    .v2-tech-chip {
      flex: 1; padding: 12px 14px; border-radius: 8px;
      border: 1px solid rgba(124,224,195,0.10);
      text-align: center;
    }
    .v2-tech-chip .chip-icon { font-size: 18px; margin-bottom: 2px; }
    .v2-tech-chip .chip-label { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .v2-tech-chip .chip-value { font-size: 16px; font-weight: 700; margin-top: 2px; color: var(--text); }
    .v2-tech-chip.chip-green { border-color: rgba(34,197,94,0.25); background: rgba(34,197,94,0.04); }
    .v2-tech-chip.chip-yellow { border-color: rgba(245,158,11,0.25); background: rgba(245,158,11,0.04); }
    .v2-tech-chip.chip-red { border-color: rgba(239,68,68,0.25); background: rgba(239,68,68,0.04); }
    .v2-tech-chip.chip-neutral { }

    /* Basic info */
    .v2-basic-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px 20px;
      padding: 12px 16px; margin-bottom: 14px;
      border: 1px solid rgba(124,224,195,0.08); border-radius: 10px;
      font-size: 12px;
    }
    .v2-basic-col { display: flex; flex-direction: column; gap: 6px; }
    .v2-basic-item { display: flex; justify-content: space-between; }
    .v2-basic-item .lbl { color: var(--muted); }
    .v2-basic-item .val { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    .v2-basic-item .val.up { color: #ef4444; }
    .v2-basic-item .val.down { color: #22c55e; }

    /* Middle grid */
    .v2-middle-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px;
    }
    .v2-panel {
      border: 1px solid rgba(124,224,195,0.10); border-radius: 10px; overflow: hidden;
    }
    .v2-panel-header {
      padding: 10px 16px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted); border-bottom: 1px solid rgba(124,224,195,0.08);
    }
    .v2-panel-body { padding: 14px 16px; }

    /* Radar */
    .v2-radar-wrap { display: flex; justify-content: center; }
    .v2-radar-wrap svg { max-width: 260px; }

    /* Dim bars */
    .v2-dim-list { display: flex; flex-direction: column; gap: 8px; }
    .v2-dim-item { }
    .v2-dim-head { display: flex; justify-content: space-between; margin-bottom: 3px; font-size: 11px; }
    .v2-dim-name { color: var(--text); font-weight: 500; }
    .v2-dim-score { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
    .v2-dim-bar-track {
      height: 4px; background: rgba(124,224,195,0.06); border-radius: 2px; overflow: hidden;
    }
    .v2-dim-bar-fill {
      height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.3s;
    }

    /* Sub table */
    .v2-table-wrap {
      overflow-x: auto; border: 1px solid rgba(124,224,195,0.10); border-radius: 10px;
      margin-bottom: 14px;
    }
    .v2-table {
      width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap;
    }
    .v2-table thead { position: sticky; top: 0; z-index: 1; }
    .v2-table th {
      padding: 8px 12px; text-align: left; font-size: 10px; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--muted); background: rgba(7,16,24,0.98);
      border-bottom: 1px solid rgba(124,224,195,0.14); font-weight: 500;
    }
    .v2-table th.num { text-align: right; }
    .v2-table td {
      padding: 7px 12px; border-bottom: 1px solid rgba(124,224,195,0.05);
      color: var(--text); vertical-align: middle;
    }
    .v2-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .v2-table tbody tr:hover { background: rgba(124,224,195,0.04); }

    /* AI report */
    .v2-ai-row {
      border: 1px solid rgba(124,224,195,0.10); border-radius: 10px; padding: 16px;
      margin-bottom: 24px;
    }
    .v2-ai-btn {
      padding: 6px 16px; background: rgba(124,224,195,0.10); border: 1px solid rgba(124,224,195,0.20);
      border-radius: 6px; color: var(--accent); font-size: 12px; cursor: pointer;
    }
    .v2-ai-btn:hover { background: rgba(124,224,195,0.18); }

    .v2-empty {
      text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px;
    }
    .v2-industry-tag {
      display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 4px;
      background: rgba(124,224,195,0.08); color: var(--accent); margin-left: 6px;
    }
  </style>
</head>
<body>
<main class="app-shell v2-shell">
  <div class="v2-topbar">
    <div class="v2-topbar-left">
      <h1>财务评分</h1>
      <span id="v2-subtitle" class="v2-symbol"></span>
    </div>
    <div class="v2-topbar-nav" id="v2-nav"></div>
  </div>

  <div class="v2-search-row">
    <input id="v2-search" class="v2-search-input" type="text"
      placeholder="输入股票代码或名称，如：600519 / 贵州茅台" autofocus autocomplete="off">
    <div id="v2-dropdown" class="v2-search-dropdown"></div>
  </div>

  <div id="v2-empty" class="v2-empty">
    输入股票代码查询财务评分 · 支持代码 / 简称 / 拼音首字母
  </div>

  <div id="v2-body" style="display:none">

    <!-- Score row -->
    <div class="v2-score-row">
      <div class="v2-score-card">
        <div class="v2-score-label">全市场总评分</div>
        <div id="v2-market-score" class="v2-score-value">—</div>
        <div id="v2-market-rank" class="v2-score-rank">排名: —</div>
        <div class="v2-score-sub">综合六大维度 · 满分 100</div>
      </div>
      <div class="v2-score-card">
        <div class="v2-score-label">行业内总评分</div>
        <div id="v2-industry-score" class="v2-score-value">—</div>
        <div id="v2-industry-rank" class="v2-score-rank">行业排名: —</div>
        <div id="v2-industry-name" class="v2-score-sub">—</div>
      </div>
      <div class="v2-score-card">
        <div class="v2-score-label">行业温度</div>
        <div id="v2-temp-value" class="v2-score-value">—</div>
        <div id="v2-temp-label" class="v2-score-rank">—</div>
        <div class="v2-score-sub">二级行业加权 PE 估值温度</div>
      </div>
      <div class="v2-score-card">
        <div class="v2-score-label">估值分位</div>
        <div id="v2-valuation-pct" class="v2-score-value">—</div>
        <div id="v2-valuation-label" class="v2-score-rank">—</div>
        <div class="v2-score-sub">行业内 PS / PE 相对位置</div>
      </div>
    </div>

    <!-- Tech signals -->
    <div class="v2-tech-row" id="v2-tech-row">
      <div class="v2-tech-chip chip-neutral" id="v2-tech-trend">
        <div class="chip-icon">—</div><div class="chip-label">趋势</div><div class="chip-value">—</div>
      </div>
      <div class="v2-tech-chip chip-neutral" id="v2-tech-momentum">
        <div class="chip-icon">—</div><div class="chip-label">动量</div><div class="chip-value">—</div>
      </div>
      <div class="v2-tech-chip chip-neutral" id="v2-tech-volume">
        <div class="chip-icon">—</div><div class="chip-label">量价</div><div class="chip-value">—</div>
      </div>
      <div class="v2-tech-chip chip-neutral" id="v2-tech-trigger">
        <div class="chip-icon">—</div><div class="chip-label">买入触发</div><div class="chip-value">—</div>
      </div>
      <div class="v2-tech-chip chip-neutral" id="v2-tech-position">
        <div class="chip-icon">—</div><div class="chip-label">位置</div><div class="chip-value">—</div>
      </div>
    </div>

    <!-- Basic info -->
    <div class="v2-basic-row" id="v2-basic-row"></div>

    <!-- Middle grid: radar + dims -->
    <div class="v2-middle-grid">
      <div class="v2-panel">
        <div class="v2-panel-header">维度雷达对照</div>
        <div class="v2-panel-body">
          <div class="v2-radar-wrap">
            <svg id="v2-radar" viewBox="0 0 280 280"></svg>
          </div>
        </div>
      </div>
      <div class="v2-panel">
        <div class="v2-panel-header">六维拆分 · 全市场</div>
        <div class="v2-panel-body">
          <div class="v2-dim-list" id="v2-dim-list"></div>
        </div>
      </div>
    </div>

    <!-- Sub-indicators table -->
    <div class="v2-table-wrap">
      <table class="v2-table">
        <thead>
          <tr>
            <th>维度</th><th>指标</th>
            <th class="num">当期</th><th class="num">上年同期</th>
            <th class="num">行业均分</th><th class="num">全市场分</th><th class="num">行业内分</th>
            <th>说明</th>
          </tr>
        </thead>
        <tbody id="v2-sub-tbody"></tbody>
      </table>
    </div>

    <!-- AI report -->
    <div class="v2-ai-row">
      <div class="v2-panel-header" style="padding:0 0 8px 0; margin-bottom:10px; border:none;">AI 财报解读</div>
      <div id="v2-ai-status" style="font-size:12px; color:var(--muted); margin-bottom:8px;">查询股票后可生成分析</div>
      <div id="v2-ai-content" style="display:none;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div><strong style="font-size:11px; color:var(--muted)">总体评价</strong><div id="v2-ai-overall" style="font-size:12px; margin-top:4px;"></div></div>
          <div><strong style="font-size:11px; color:var(--muted)">亮点</strong><div id="v2-ai-highlights" style="font-size:12px; margin-top:4px;"></div></div>
          <div><strong style="font-size:11px; color:var(--muted)">风险</strong><div id="v2-ai-risks" style="font-size:12px; margin-top:4px;"></div></div>
          <div><strong style="font-size:11px; color:var(--muted)">加分 / 减分</strong><div style="font-size:12px; margin-top:4px;"><span id="v2-ai-positive" style="color:var(--score-green)"></span> <span id="v2-ai-negative" style="color:var(--score-red)"></span></div></div>
        </div>
      </div>
      <button id="v2-ai-btn" class="v2-ai-btn" style="display:none;">生成 AI 财报解读</button>
    </div>

  </div>
</main>

<script src="/nav.js"></script>
<script>
(function(){
  var search = document.getElementById('v2-search');
  var dropdown = document.getElementById('v2-dropdown');
  var body = document.getElementById('v2-body');
  var empty = document.getElementById('v2-empty');

  var currentMarket = null, currentSymbol = null, currentName = null;

  // --- Nav ---
  var navLinks = [
    ['/stock-score.html','财务评分'],['/stock-screener.html','股票筛选'],
    ['/realtime-screener.html','实时选股'],['/rps-pool.html','RPS'],
    ['/watchlist.html','自选股'],['/concept-analysis.html','概念分析'],
    ['/data-update.html','更新']
  ];
  var navEl = document.getElementById('v2-nav');
  navLinks.forEach(function(l){
    var a = document.createElement('a');
    a.href = l[0]; a.textContent = l[1];
    if (l[0] === '/stock-score-v2.html') a.className = 'active';
    navEl.appendChild(a);
  });

  // --- Search ---
  var searchTimer = null;
  search.addEventListener('input', function(){
    clearTimeout(searchTimer);
    var q = search.value.trim();
    if (!q || q.length < 2) { dropdown.classList.remove('show'); return; }
    searchTimer = setTimeout(function(){
      fetch('/api/search/stocks?q=' + encodeURIComponent(q) + '&limit=8')
        .then(function(r){ return r.json(); })
        .then(function(data){
          var items = data.results || data.items || data.stocks || [];
          if (!items.length) { dropdown.classList.remove('show'); return; }
          dropdown.innerHTML = items.map(function(s, i){
            var m = s.market || '', sym = s.symbol || '', n = s.stock_name || s.name || '';
            return '<div class="v2-search-item" data-i="'+i+'" data-m="'+esc(m)+'" data-sym="'+esc(sym)+'" data-name="'+esc(n)+'">' +
              '<strong>'+esc(n)+'</strong> <span style="color:var(--muted);font-size:11px">'+m.toUpperCase()+':'+sym+'</span>' +
              '</div>';
          }).join('');
          dropdown.classList.add('show');
        }).catch(function(){ dropdown.classList.remove('show'); });
    }, 200);
  });

  dropdown.addEventListener('click', function(e){
    var item = e.target.closest('.v2-search-item');
    if (!item) return;
    currentMarket = item.dataset.m; currentSymbol = item.dataset.sym;
    currentName = item.dataset.name;
    search.value = currentName;
    dropdown.classList.remove('show');
    loadStock();
  });

  search.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){
      var active = dropdown.querySelector('.v2-search-item.active');
      if (active) { active.click(); return; }
      var q = search.value.trim();
      if (q) { searchByCode(q); }
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      var items = dropdown.querySelectorAll('.v2-search-item');
      if (!items.length) return;
      var cur = dropdown.querySelector('.v2-search-item.active');
      var idx = cur ? parseInt(cur.dataset.i) : -1;
      var next = e.key === 'ArrowDown' ? Math.min(idx + 1, items.length - 1) : Math.max(idx - 1, 0);
      if (cur) cur.classList.remove('active');
      items[next].classList.add('active');
    }
  });

  document.addEventListener('click', function(e){ if (!e.target.closest('.v2-search-row')) dropdown.classList.remove('show'); });

  function searchByCode(q){
    search.placeholder = '搜索中...';
    search.disabled = true;
    fetch('/api/search/stocks?q=' + encodeURIComponent(q) + '&limit=1')
      .then(function(r){ return r.json(); })
      .then(function(data){
        var items = data.results || data.items || data.stocks || [];
        if (items.length){
          currentMarket = items[0].market; currentSymbol = items[0].symbol;
          currentName = items[0].stock_name || items[0].name;
          loadStock();
        } else {
          empty.innerHTML = '<div class="v2-empty">未找到匹配股票，请尝试输入完整代码如 sh:600519</div>';
          empty.style.display = 'block';
          body.style.display = 'none';
        }
      }).catch(function(){
        empty.innerHTML = '<div class="v2-empty">搜索请求超时，请重试</div>';
        empty.style.display = 'block';
        body.style.display = 'none';
      }).finally(function(){
        search.placeholder = '输入股票代码或名称，如：600519 / 贵州茅台';
        search.disabled = false;
      });
  }

  // --- Load stock ---
  function loadStock(){
    if (!currentMarket || !currentSymbol) return;
    empty.style.display = 'none';
    body.style.display = 'block';
    document.getElementById('v2-subtitle').textContent = (currentName||'') + ' · ' + currentMarket.toUpperCase() + ':' + currentSymbol;

    var m = currentMarket, s = currentSymbol;

    // Fetch core data in parallel
    Promise.all([
      fetch('/api/stock-score?market=' + m + '&symbol=' + s).then(function(r){ return r.json(); }),
      fetch('/api/technical-eval?market=' + m + '&symbol=' + s).then(function(r){ return r.json(); }),
      fetch('/api/relative-valuation?market=' + m + '&symbol=' + s).then(function(r){ return r.json(); }),
      fetch('/api/stock-profile?symbol=' + s).then(function(r){ return r.json(); })
    ]).then(function(results){
      var score = results[0], tech = results[1], valuation = results[2], profile = results[3];
      renderScore(score);
      renderTech(tech);
      renderValuation(valuation);
      renderProfile(profile);
      renderSubTable(score);
    }).catch(function(e){ console.error(e); });
  }

  // --- Render score ---
  function renderScore(d){
    if (!d) return;
    var mkScore = d.total_score;
    var indScore = d.ind_total_score;
    var mkRank = d.market_total_rank;
    var indRank = d.industry_total_rank;
    var indSize = d.industry_total_universe_size;

    document.getElementById('v2-market-score').textContent = mkScore != null ? Number(mkScore).toFixed(1) : '—';
    document.getElementById('v2-market-rank').textContent = mkRank != null ? '全市场第 ' + mkRank + ' 名' : '排名: —';
    document.getElementById('v2-industry-score').textContent = indScore != null ? Number(indScore).toFixed(1) : '—';
    document.getElementById('v2-industry-rank').textContent = indRank != null ? '行业第 ' + indRank + (indSize ? '/' + indSize : '') + ' 名' : '行业排名: —';
    document.getElementById('v2-industry-name').textContent = d.ind1 || d.ind2 || '—';

    // Dim scores
    var dims = d.dim_scores || d.market_dim_scores || {};
    var dimNames = {profitability:'盈利能力', growth:'成长能力', operating:'运营效率', cashflow:'现金流质量', solvency:'偿债能力', asset_quality:'资产质量'};
    var dimOrder = ['profitability','growth','operating','cashflow','solvency','asset_quality'];
    var dimList = document.getElementById('v2-dim-list');
    dimList.innerHTML = dimOrder.map(function(dk){
      var score = dims[dk] != null ? Number(dims[dk]).toFixed(1) : '—';
      var maxScore = {'profitability':25,'growth':20,'operating':15,'cashflow':20,'solvency':10,'asset_quality':10}[dk]||25;
      var pct = dims[dk] != null ? Math.min(100, Number(dims[dk])/maxScore*100) : 0;
      return '<div class="v2-dim-item">' +
        '<div class="v2-dim-head"><span class="v2-dim-name">'+dimNames[dk]+'</span><span class="v2-dim-score">'+score+'/'+maxScore+'</span></div>' +
        '<div class="v2-dim-bar-track"><div class="v2-dim-bar-fill" style="width:'+pct+'%"></div></div>' +
        '</div>';
    }).join('');

    // Only update temperature from score if valuation doesn't have it
    if (d.industry_temperature != null) {
      document.getElementById('v2-temp-value').textContent = Number(d.industry_temperature).toFixed(1);
    }
  }

  function renderTech(d){
    if (!d) return;
    var signals = {
      trend: {el:'v2-tech-trend', v: d.trend, l: d.trend_label},
      momentum: {el:'v2-tech-momentum', v: d.momentum, l: d.momentum_label},
      volume: {el:'v2-tech-volume', v: d.volume_signal, l: d.volume_label},
      trigger: {el:'v2-tech-trigger', v: d.buy_trigger, l: d.buy_trigger_label},
      position: {el:'v2-tech-position', v: d.position, l: d.position_label}
    };
    function classify(val){
      if (!val || val === 'normal' || val === 'weak') return {icon:'\u26AA', cls:'chip-neutral'};
      if (val === 'bullish' || val === 'strong_bullish' || val === 'high' || val === 'true' || val === true) return {icon:'\u{1F7E2}', cls:'chip-green'};
      if (val === 'bearish' || val === 'strong_bearish' || val === 'low') return {icon:'\u{1F534}', cls:'chip-red'};
      if (val === 'recovering' || val === 'weak_bearish' || val === 'mid') return {icon:'\u{1F7E1}', cls:'chip-yellow'};
      return {icon:'\u26AA', cls:'chip-neutral'};
    }
    Object.keys(signals).forEach(function(k){
      var s = signals[k];
      var el = document.getElementById(s.el);
      if (!el) return;
      var res = classify(s.v);
      var label = s.l || s.v || '—';
      el.className = 'v2-tech-chip ' + res.cls;
      el.querySelector('.chip-icon').textContent = res.icon;
      el.querySelector('.chip-value').textContent = label;
    });
  }

  function renderValuation(d){
    if (!d) return;
    if (d.industry_temperature_percentile_since_2022 != null){
      document.getElementById('v2-temp-value').textContent = Number(d.industry_temperature_percentile_since_2022).toFixed(1);
      document.getElementById('v2-temp-label').textContent = d.industry_temperature_label || '';
    }
    if (d.primary_percentile != null){
      document.getElementById('v2-valuation-pct').textContent = Number(d.primary_percentile).toFixed(0) + '%';
      document.getElementById('v2-valuation-label').textContent = d.valuation_band_label || '';
    }
  }

  function renderProfile(d){
    if (!d) return;
    var profile = d.profile || d;
    var info = profile.basic_info || profile;
    var rows = [
      ['现价', info.current_price != null ? Number(info.current_price).toFixed(2) : '—', ''],
      ['涨幅', info.change_pct != null ? (info.change_pct >= 0 ? '+' : '') + Number(info.change_pct).toFixed(2) + '%' : '—', info.change_pct >= 0 ? 'up' : 'down'],
      ['PE-TTM', info.dynamic_pe != null ? Number(info.dynamic_pe).toFixed(1) : '—', ''],
      ['PS-TTM', info.ps_ttm != null ? Number(info.ps_ttm).toFixed(2) : '—', ''],
      ['A股市值', info.a_share_market_cap != null ? (Number(info.a_share_market_cap) >= 10000 ? (Number(info.a_share_market_cap)/10000).toFixed(2) + '万亿' : Number(info.a_share_market_cap).toFixed(0) + '亿') : '—', ''],
      ['流通股本', info.float_shares != null ? Number(info.float_shares).toFixed(2) + '亿' : '—', ''],
      ['总股本', info.total_shares != null ? Number(info.total_shares).toFixed(2) + '亿' : '—', ''],
      ['EPS', info.eps != null ? Number(info.eps).toFixed(3) : '—', '']
    ];
    document.getElementById('v2-basic-row').innerHTML = '<div class="v2-basic-col">' +
      rows.slice(0,4).map(function(r){ return '<div class="v2-basic-item"><span class="lbl">'+r[0]+'</span><span class="val '+r[2]+'">'+r[1]+'</span></div>'; }).join('') +
      '</div><div class="v2-basic-col">' +
      rows.slice(4).map(function(r){ return '<div class="v2-basic-item"><span class="lbl">'+r[0]+'</span><span class="val '+r[2]+'">'+r[1]+'</span></div>'; }).join('') +
      '</div>';
  }

  function renderSubTable(d){
    if (!d) return;
    var tbody = document.getElementById('v2-sub-tbody');
    var diag = d.sub_indicator_diagnostics || {};
    var sub = d.sub_indicators || {};
    var keys = Object.keys(diag);
    if (!keys.length && !Object.keys(sub).length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:20px">暂无细分指标数据</td></tr>'; return;
    }
    // Use diagnostics data for richer display
    var dimMap = {roe_ex:'盈利能力', net_margin:'盈利能力', roe_pct:'盈利能力',
      revenue_growth:'成长能力', profit_growth:'成长能力', ex_profit_growth:'成长能力',
      ar_days:'运营效率', inv_days:'运营效率', asset_turn:'运营效率',
      ocf_to_profit:'现金流质量', ocf_to_rev:'现金流质量', free_cf:'现金流质量',
      debt_ratio:'偿债能力', current_ratio:'偿债能力', quick_ratio:'偿债能力',
      ar_to_asset:'资产质量', inv_to_asset:'资产质量', goodwill_ratio:'资产质量', impair_to_rev:'资产质量'};
    var rows = keys.map(function(k){
      var v = diag[k] || {};
      var name = v.indicator_name || k;
      var ch = v.change || {};
      var attr = v.attribution || {};
      return '<tr>' +
        '<td>'+esc(dimMap[k]||'')+'</td>' +
        '<td>'+esc(name)+'</td>' +
        '<td class="num">'+fmv(ch.current_value)+'</td>' +
        '<td class="num">'+fmv(ch.previous_value)+'</td>' +
        '<td class="num">—</td>' +
        '<td class="num">'+fmv(v.market_score)+'</td>' +
        '<td class="num">'+fmv(v.industry_score)+'</td>' +
        '<td style="font-size:10px;color:var(--muted);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(ch.summary||'')+'">'+esc(ch.summary||'')+'</td>' +
        '</tr>';
    });
    tbody.innerHTML = rows.join('');
  }

  function renderRadar(){
    var svg = document.getElementById('v2-radar');
    var cx=140, cy=140, r=100;
    var dims = ['盈利能力','成长能力','运营效率','现金流质量','偿债能力','资产质量'];
    var n = dims.length;
    var angleStep = 2*Math.PI/n;
    var levels = [0.25,0.5,0.75,1.0];

    var html = '';
    // Grid lines
    levels.forEach(function(lv){
      var pts = dims.map(function(_,i){
        var a = -Math.PI/2 + i*angleStep;
        return (cx + r*lv*Math.cos(a)) + ',' + (cy + r*lv*Math.sin(a));
      });
      html += '<polygon points="'+pts.join(' ')+'" fill="none" stroke="rgba(124,224,195,0.12)" stroke-width="0.5"/>';
    });
    // Axes
    dims.forEach(function(_,i){
      var a = -Math.PI/2 + i*angleStep;
      html += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*Math.cos(a))+'" y2="'+(cy+r*Math.sin(a))+'" stroke="rgba(124,224,195,0.10)" stroke-width="0.5"/>';
    });
    // Labels
    dims.forEach(function(d,i){
      var a = -Math.PI/2 + i*angleStep;
      var lx = cx + (r+22)*Math.cos(a), ly = cy + (r+22)*Math.sin(a);
      html += '<text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="10">'+d+'</text>';
    });
    svg.innerHTML = html;
  }

  // AI report
  var aiBtn = document.getElementById('v2-ai-btn');
  if (currentMarket && currentSymbol) aiBtn.style.display = 'inline-block';
  aiBtn.addEventListener('click', function(){
    aiBtn.disabled = true; aiBtn.textContent = '生成中...';
    fetch('/api/stock-score-ai-report?market='+currentMarket+'&symbol='+currentSymbol)
      .then(function(r){ return r.json(); })
      .then(function(d){
        document.getElementById('v2-ai-status').style.display = 'none';
        document.getElementById('v2-ai-content').style.display = 'block';
        aiBtn.style.display = 'none';
        document.getElementById('v2-ai-overall').textContent = d.overall || d.summary || '—';
        document.getElementById('v2-ai-highlights').textContent = (d.highlights||[]).join('; ') || '—';
        document.getElementById('v2-ai-risks').textContent = (d.risks||[]).join('; ') || '—';
        document.getElementById('v2-ai-positive').textContent = (d.positive||[]).join('; ') || '';
        document.getElementById('v2-ai-negative').textContent = (d.negative||[]).join('; ') || '';
      }).catch(function(e){
        document.getElementById('v2-ai-status').textContent = '生成失败: '+e.message;
      }).finally(function(){
        aiBtn.disabled = false; aiBtn.textContent = '生成 AI 财报解读';
      });
  });

  function showAiButton(){ if(currentMarket && currentSymbol) aiBtn.style.display = 'inline-block'; }

  // Helpers
  function esc(s){ return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }
  function fmv(v){ return v != null ? (typeof v === 'number' ? v.toFixed(2) : v) : '—'; }

  // Check URL params for auto-load
  var params = new URLSearchParams(window.location.search);
  if (params.get('market') && params.get('symbol')){
    currentMarket = params.get('market'); currentSymbol = params.get('symbol');
    currentName = params.get('name') || '';
    search.value = currentName || (currentMarket+':'+currentSymbol);
    loadStock();
  }
})();
</script>
</body>
</html>
