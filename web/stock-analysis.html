<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>股票分析</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .analysis-metric-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:14px; }
    .analysis-metric-card { min-width:0; height:154px; padding:12px 14px; border:1px solid rgba(124,224,195,.14); border-radius:10px; background:rgba(124,224,195,.025); display:flex; flex-direction:column; }
    .analysis-metric-heading { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
    .analysis-metric-heading h2 { margin:0; font-size:15px; color:var(--text); }
    .analysis-metric-unit { color:var(--muted); font-size:11px; }
    .analysis-bar-chart { flex:1; min-height:0; display:flex; gap:10px; align-items:flex-end; padding-top:12px; }
    .analysis-bar-item { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; }
    .analysis-bar-value { font-size:11px; color:var(--text); white-space:nowrap; font-variant-numeric:tabular-nums; }
    .analysis-bar, .analysis-bar.profit { width:min(38px,75%); min-height:2px; border-radius:4px 4px 1px 1px; background:linear-gradient(180deg,#ff6b6b,#9f2634); }
    .analysis-bar-year { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .analysis-metric-status { flex:1; display:flex; align-items:center; color:var(--muted); font-size:12px; }
    @media (max-width:760px) { .analysis-metric-grid { grid-template-columns:1fr; } .analysis-metric-card { height:154px; } }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">STOCK ANALYSIS</p><h1>股票分析</h1></div>
      <div class="topbar-actions" id="global-nav"></div>
    </header>

    <form class="search-form stock-score-search-form" id="stock-analysis-search-form" novalidate>
      <div class="search-input-wrap">
        <input type="text" id="stock-input" placeholder="600519 / sh:600519 / 贵州茅台" autocomplete="off" aria-label="股票代码或名称">
        <div class="search-dropdown" id="stock-dropdown"></div>
      </div>
    </form>

    <section class="analysis-metric-grid" aria-label="五年经营指标">
      <article class="analysis-metric-card"><div class="analysis-metric-heading"><h2>营业收入</h2><span class="analysis-metric-unit">单位：亿元</span></div><div class="analysis-metric-status" id="revenue-chart">选择股票后加载最近五年财报数据</div></article>
      <article class="analysis-metric-card"><div class="analysis-metric-heading"><h2>营收增速</h2><span class="analysis-metric-unit">单位：%</span></div><div class="analysis-metric-status" id="revenue-growth-chart">选择股票后加载同比增速</div></article>
      <article class="analysis-metric-card"><div class="analysis-metric-heading"><h2>归母净利润</h2><span class="analysis-metric-unit">单位：亿元</span></div><div class="analysis-metric-status" id="profit-chart">选择股票后加载最近五年财报数据</div></article>
      <article class="analysis-metric-card"><div class="analysis-metric-heading"><h2>扣非增速</h2><span class="analysis-metric-unit">单位：%</span></div><div class="analysis-metric-status" id="ex-profit-growth-chart">选择股票后加载同比增速</div></article>
    </section>
  </main>
  <script src="/nav.js?v=20261008-stock-analysis-v1"></script>
  <script src="/stock-analysis.js?v=20261008-search-v2"></script>
</body>
</html>
