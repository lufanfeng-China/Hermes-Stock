<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>股票筛选</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell stock-screener-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">STOCK SCREENER TERMINAL</p>
        <h1>股票筛选</h1>
      </div>
      <div class="topbar-actions" id="global-nav"></div>
    </header>

    <!-- ── 日期栏（始终可见，第一步操作） ── -->
    <div class="screener-date-bar">
      <span class="screener-date-bar-label">📅 回测日期</span>
      <div class="asof-date-picker" id="stock-screener-asof-picker">
        <button type="button" id="stock-screener-asof-display" class="asof-date-display" title="点击选择回测日期">
          <span id="stock-screener-asof-text">当前数据（最新）</span>
          <span class="asof-date-arrow">▾</span>
        </button>
        <div class="asof-date-dropdown" id="stock-screener-asof-dropdown" hidden>
          <div class="asof-date-nav">
            <button type="button" class="asof-nav-btn" id="asof-prev-month">◀</button>
            <span id="asof-month-label">2026年5月</span>
            <button type="button" class="asof-nav-btn" id="asof-next-month">▶</button>
          </div>
          <div class="asof-weekdays">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div class="asof-days-grid" id="asof-days-grid"></div>
          <div class="asof-date-actions">
            <button type="button" id="asof-clear-date" class="nav-link">清除日期</button>
            <button type="button" id="asof-today-date" class="nav-link">今天</button>
          </div>
        </div>
      </div>
      <div class="asof-quick-presets" id="asof-quick-presets">
        <button type="button" class="nav-link asof-preset-btn" data-offset="5">5天前</button>
        <button type="button" class="nav-link asof-preset-btn" data-offset="10">10天前</button>
        <button type="button" class="nav-link asof-preset-btn" data-offset="20">20天前</button>
        <button type="button" class="nav-link asof-preset-btn" data-offset="60">60天前</button>
      </div>
    </div>

    <section class="search-card stock-screener-filter-card">
      <div class="search-card-header">
        <div>
          <p class="eyebrow">FILTER WORKBENCH</p>
          <h2>筛选条件</h2>
        </div>
        <div class="stock-screener-filter-head-actions">
          <button id="stock-screener-filter-toggle" class="nav-link stock-screener-filter-toggle" type="button" aria-controls="stock-screener-filter-form" aria-expanded="false">展开筛选</button>
          <p id="stock-screener-status" class="search-meta">支持多条件叠加筛选，每页 50 条</p>
        </div>
      </div>

      <div id="stock-screener-strategy-buttons" class="stock-screener-filter-actions" role="group" aria-label="策略预设">
        <button type="button" class="nav-link" data-strategy="rps_first">RPS首次</button>
        <button type="button" class="nav-link" data-strategy="ma_cross">均线选股</button>
        <button type="button" class="nav-link" data-strategy="blowup_stall">爆量滞涨</button>
        <button type="button" class="nav-link" data-strategy="blowup_break">爆量突破</button>
        <button type="button" class="nav-link" data-strategy="ma_pullback">均线回踩</button>
        <button id="stock-screener-sync-tdx-btn" class="nav-link" type="button" style="margin-left:16px">同步到AI股池</button>
        <button id="stock-screener-save-preset-btn" class="nav-link" type="button" style="margin-left:auto">💾 保存方案</button>
        <div id="stock-screener-preset-dropdown" class="preset-dropdown" style="display:none">
          <button id="stock-screener-preset-toggle" class="nav-link" type="button">已存方案 ▾</button>
          <div id="stock-screener-preset-menu" class="preset-menu" hidden></div>
        </div>
        <button id="stock-screener-delete-preset-btn" class="nav-link" type="button" style="display:none;color:#ef4444" title="删除当前方案">✕</button>
      </div>
      <p id="stock-screener-strategy-desc" class="search-meta stock-screener-strategy-desc"></p>

      <form id="stock-screener-filter-form" class="stock-screener-filter-grid" onsubmit="return false;" hidden>
        <input name="strategy" type="hidden" value="">
        <input type="hidden" id="stock-screener-asof-date" name="as_of_date" value="">

        <!-- ── 评分与排名 ── -->
        <fieldset class="filter-group">
          <legend>评分与排名</legend>
          <div class="filter-row"><label>全市场总分 ≥</label><input name="min_total_score" type="number" step="0.1"></div>
          <div class="filter-row"><label>行业内总分 ≥</label><input name="min_ind_total_score" type="number" step="0.1"></div>
          <div class="filter-row"><label>评分背离</label><select name="score_divergence"><option value="">不限</option><option value="positive">🟢 趋势好转</option><option value="negative">🔴 趋势变坏</option></select></div>
          <div class="filter-row"><label>全市场排名 ≤</label><input name="max_market_rank" type="number" step="1"></div>
          <div class="filter-row"><label>二级行业排名 ≤</label><input name="max_industry_rank" type="number" step="1"></div>
        </fieldset>

        <!-- ── 行业和概念 ── -->
        <fieldset class="filter-group">
          <legend>行业和概念</legend>
          <div class="filter-row"><label>申万一级</label><select id="stock-screener-level1" name="industry_level_1" multiple></select></div>
          <div class="filter-row"><label>申万二级</label><select id="stock-screener-level2" name="industry_level_2" multiple></select></div>
        </fieldset>

        <!-- ── RPS 动量 ── -->
        <fieldset class="filter-group filter-rps">
          <legend>RPS 动量</legend>
          <div class="filter-row rps-total-row">
            <label class="filter-label">个股RPS总分 ≥</label><input name="min_rps_total" type="number" step="0.1" placeholder="如 350">
            <label class="filter-label">行业RPS总分 ≥</label><input name="min_industry_rps_total" type="number" step="0.1" placeholder="如 250">
          </div>
          <div class="filter-row"><label>个股 RPS20 ≥</label><input name="min_rps_20" type="number" step="0.1"></div>
          <div class="filter-row"><label>个股 RPS50 ≥</label><input name="min_rps_50" type="number" step="0.1"></div>
          <div class="filter-row"><label>个股 RPS120 ≥</label><input name="min_rps_120" type="number" step="0.1"></div>
          <div class="filter-row"><label>个股 RPS250 ≥</label><input name="min_rps_250" type="number" step="0.1"></div>
          <div class="filter-row"><label>行业 RPS20 ≥</label><input name="min_industry_rps_20" type="number" step="0.1"></div>
          <div class="filter-row"><label>行业 RPS50 ≥</label><input name="min_industry_rps_50" type="number" step="0.1"></div>
          <div class="filter-row"><label>行业 RPS120 ≥</label><input name="min_industry_rps_120" type="number" step="0.1"></div>
          <div class="filter-row"><label>行业 RPS250 ≥</label><input name="min_industry_rps_250" type="number" step="0.1"></div>
        </fieldset>

        <!-- ── 估值信息 ── -->
        <fieldset class="filter-group">
          <legend>估值信息</legend>
          <div class="filter-row"><label>估值分类</label><select name="classification"><option value="">不限</option><option value="A_NORMAL_EARNING">A类 正常盈利</option><option value="B_THIN_PROFIT_DISTORTED">B类 微盈利畸高</option><option value="C_LOSS">C/D 亏损或高风险</option></select></div>
          <div class="filter-row"><label>区间标签</label><select id="stock-screener-valuation-band" name="valuation_band" multiple><option value="低估区间">低估区间</option><option value="合理偏低">合理偏低</option><option value="合理">合理</option><option value="合理偏高">合理偏高</option><option value="高估区间">高估区间</option><option value="样本不足">样本不足</option><option value="次新股">次新股</option></select></div>
          <div class="filter-row"><label>行业内估值位置 ≤</label><input name="max_primary_percentile" type="number" step="0.1"></div>
          <div class="filter-row"><label>行业温度</label><select id="stock-screener-temperature" name="industry_temperature_label" multiple><option>行业偏冷</option><option>行业温和</option><option>行业偏热</option><option>行业过热</option></select></div>
        </fieldset>

        <!-- ── 技术面（信号灯） ── -->
        <fieldset class="filter-group filter-tech-signals">
          <legend>技术面（信号灯）</legend>
          <div class="filter-row"><label>趋势切换</label><select name="trend_switch" multiple><option value="recovering">🟡 刚变修复中</option><option value="bullish">🟢 刚变多头</option><option value="strong_bullish">🟢 刚变强多头</option></select></div>
          <div class="filter-row"><label>趋势</label><select name="tech_trend" multiple><option value="strong_bullish">🟢 强多头</option><option value="bullish">🟢 多头</option><option value="recovering">🟡 修复中</option><option value="neutral">⚪ 震荡</option><option value="bearish">🔴 空头</option><option value="strong_bearish">🔴 强空头</option></select></div>
          <div class="filter-row"><label>短期趋势切换</label><select name="short_trend_switch" multiple><option value="recovering">🟡 刚变修复中</option><option value="bullish">🟢 刚变多头</option><option value="strong_bullish">🟢 刚变强多头</option></select></div>
          <div class="filter-row"><label>短期趋势</label><select name="tech_short_trend" multiple><option value="strong_bullish">🟢 强多头</option><option value="bullish">🟢 多头</option><option value="recovering">🟡 修复中</option><option value="neutral">⚪ 震荡</option><option value="bearish">🔴 空头</option><option value="strong_bearish">🔴 强空头</option></select></div>
          <div class="filter-row"><label>动量</label><select name="tech_momentum" multiple><option value="super_strong">🟢 极强</option><option value="strong">🟢 强势</option><option value="startup">🟢 启动</option><option value="neutral">⚪ 中性</option><option value="weak">🔴 弱势</option></select></div>
          <div class="filter-row"><label>均线上穿</label><select name="golden_cross" multiple><option value="5/10">MA5上穿MA10</option><option value="10/20">MA10上穿MA20</option><option value="5/20">MA5上穿MA20</option><option value="20/60">MA20上穿MA60</option><option value="5/60">MA5上穿MA60</option></select></div>
          <div class="filter-row"><label>MACD金叉</label><select name="macd_cross" multiple><option value="zero_below">🔴 零轴下金叉</option><option value="zero_above">🟢 零轴上金叉</option></select></div>
          <div class="filter-row"><label>量能</label><select name="tech_volume"><option value="">不限</option><option value="bullish">🟢 放量配合</option><option value="!divergence">🟢🟡 非背离</option></select></div>
          <div class="filter-row"><label>位置</label><select name="tech_position"><option value="">不限</option><option value="low">🟢 低位</option><option value="!high">🟢🟡 非高位</option><option value="mid">🟡 中位</option></select></div>
          <div class="filter-row"><label>综合</label><select name="tech_conclusion"><option value="">不限</option><option value="buy_confirmed">🟢 确认买入</option><option value="buy_watch">🟡 买点观察</option><option value="wait_buy">🟡 等待买点</option><option value="left_observe">🟡 左侧观察</option><option value="!avoid">🟢🟡 非回避</option></select></div>
          <div class="filter-row"><label>买入触发</label><select name="tech_buy_trigger"><option value="">不限</option><option value="any">有任意买入信号</option><option value="breakout">突破买入</option><option value="pullback">回踩买入</option><option value="strong_break">强势突破</option><option value="golden_cross">金叉观察</option></select></div>
          <div class="filter-row"><label>MACD判断</label><select name="macd_signal"><option value="">全部</option><option value="二次金叉">二次金叉</option><option value="金叉转强">金叉转强</option><option value="背离1次">背离1次</option><option value="背离2次">背离2次</option><option value="背离多次">背离多次</option></select></div>
        </fieldset>

        <!-- ── 财务维度 ── -->
        <fieldset class="filter-group">
          <legend>财务维度</legend>
          <div class="filter-row"><label>盈利能力 ≥</label><input name="min_dim_profitability" type="number" step="0.1"></div>
          <div class="filter-row"><label>成长能力 ≥</label><input name="min_dim_growth" type="number" step="0.1"></div>
          <div class="filter-row"><label>现金流质量 ≥</label><input name="min_dim_cashflow" type="number" step="0.1"></div>
          <div class="filter-row"><label>偿债能力 ≥</label><input name="min_dim_solvency" type="number" step="0.1"></div>
          <div class="filter-row"><label>资产质量 ≥</label><input name="min_dim_asset_quality" type="number" step="0.1"></div>
          <div class="filter-row"><label>扣非ROE ≥</label><input name="min_sub_roe_ex" type="number" step="0.1"></div>
          <div class="filter-row"><label>净利增速 ≥</label><input name="min_sub_profit_growth" type="number" step="0.1"></div>
          <div class="filter-row"><label>自由现金流 ≥</label><input name="min_sub_free_cf" type="number" step="0.1"></div>
        </fieldset>

        <!-- ── 价格区间 ── -->
        <fieldset class="filter-group">
          <legend>价格区间</legend>
          <div class="filter-row"><label>现价 ≥</label><input name="min_current_price" type="number" step="0.01"></div>
          <div class="filter-row"><label>现价 ≤</label><input name="max_current_price" type="number" step="0.01"></div>
          <div class="filter-row"><label>5年分位 ≥</label><input name="min_price_percentile_5y" type="number" step="0.1"></div>
          <div class="filter-row"><label>5年分位 ≤</label><input name="max_price_percentile_5y" type="number" step="0.1"></div>
          <div class="filter-row"><label>PE-TTM ≥</label><input name="min_pe_ttm" type="number" step="0.01"></div>
          <div class="filter-row"><label>PE-TTM ≤</label><input name="max_pe_ttm" type="number" step="0.01"></div>
        </fieldset>

        <div class="stock-screener-filter-actions">
          <button id="stock-screener-apply-btn" type="button">执行筛选</button>
          <button id="stock-screener-reset-btn" type="button" class="nav-link">重置</button>
        </div>
      </form>
    </section>

    <section class="profile-card stock-screener-results-card">
      <div class="search-card-header">
        <div>
          <p class="eyebrow">SCREENED STOCKS</p>
          <h2>筛选结果 <span id="stock-screener-count" class="pool-badge">0</span></h2>
        </div>
        <p id="stock-screener-page-info" class="search-meta">第 1 / 1 页</p>
        <p id="stock-screener-data-date" class="search-meta" style="color:#6f8899;font-size:10px"></p>
      </div>
      <div id="stock-screener-results-toolbar" class="stock-screener-results-toolbar" style="display:none">
        <label class="wl-select-all-label"><input type="checkbox" id="wl-select-all"> 全选</label>
        <button id="wl-add-btn" class="nav-link" type="button">⭐ 加入自选 (<span id="wl-selected-count">0</span>)</button>
      </div>
      <div class="stock-screener-results-wrap">
        <table class="sub-table stock-screener-table">
          <thead>
            <tr>
              <th></th>
              <th>股票名称</th>
              <th>现价</th>
              <th>10MA距离</th>
              <th>PE-TTM</th>
              <th>趋势</th>
              <th>短期趋势</th>
              <th>短延续</th>
              <th>RPS</th>
              <th>前低股价</th>
              <th>前低位置</th>
              <th>排名(全/二级)</th>
              <th>估值位置</th>
              <th>行业温度</th>
              <th>行业维度</th>
              <th>行业分数</th>
            </tr>
          </thead>
          <tbody id="stock-screener-results-tbody">
            <tr><td colspan="15" class="stock-score-empty-row">设置条件后点击"执行筛选"</td></tr>
          </tbody>
        </table>
      </div>
      <div id="stock-screener-results-toolbar-bottom" class="stock-screener-results-toolbar" style="display:none">
        <label class="wl-select-all-label"><input type="checkbox" id="wl-select-all-bottom"> 全选</label>
        <button id="wl-add-btn-bottom" class="nav-link" type="button">⭐ 加入自选</button>
      </div>
      <div id="stock-screener-pagination" class="stock-screener-pagination">
        <button id="stock-screener-prev" type="button" class="nav-link">上一页</button>
        <button id="stock-screener-next" type="button" class="nav-link">下一页</button>
      </div>
    </section>

    <section id="stock-screener-kline-section" class="kline-section terminal-panel hidden">
      <div class="kline-header terminal-panel-header">
        <div>
          <p class="eyebrow">KLINE CHART</p>
          <h2 id="stock-screener-kline-title">—</h2>
        </div>
        <div class="kline-controls">
          <div id="stock-screener-preset-controls" class="zoom-controls" role="group" aria-label="Kline preset windows">
            <button type="button" class="zoom-button" data-preset="20">20D</button>
            <button type="button" class="zoom-button active" data-preset="60">60D</button>
            <button type="button" class="zoom-button" data-preset="120">120D</button>
            <button type="button" class="zoom-button" data-preset="250">250D</button>
            <button type="button" class="zoom-button" data-preset="-1">ALL</button>
          </div>
          <span id="stock-screener-kline-range-label" class="kline-range-label"></span>
        </div>
      </div>
      <div class="kline-chart-wrap">
        <svg id="stock-screener-kline-svg" class="kline-svg"></svg>
      </div>
    </section>
  </main>

  <script src="/nav.js"></script>
  <script type="module" src="/stock-screener.js?v=20260614-div"></script>
</body>
</html>
