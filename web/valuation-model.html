<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>估值模型 — Project Hermes Stock</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --orange: #d2991d;
    --purple: #a371f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.6 'Segoe UI', system-ui, sans-serif; }
  /* Nav */
  .topbar {
    display: flex; gap: 12px; align-items: center; padding: 8px 16px;
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  .topbar a { color: var(--muted); text-decoration: none; font-size: 12px; padding: 4px 10px; border-radius: 4px; }
  .topbar a:hover, .topbar a.active { color: var(--text); background: #21262d; }
  /* Search */
  .search-bar {
    display: flex; gap: 8px; padding: 12px 16px; background: #0d1117;
    border-bottom: 1px solid var(--border); align-items: center;
  }
  .search-bar input {
    background: #0d1117; color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; font-size: 13px; width: 200px;
  }
  .search-bar input:focus { outline: none; border-color: var(--accent); }
  .search-bar button {
    background: var(--accent); color: #000; border: none;
    padding: 6px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .search-bar button:hover { opacity: 0.85; }
  /* Stock info strip */
  .stock-info {
    display: flex; gap: 24px; padding: 10px 16px; background: var(--card);
    border-bottom: 1px solid var(--border); align-items: baseline; flex-wrap: wrap;
  }
  .stock-info .name { font-size: 16px; font-weight: 600; color: var(--accent); }
  .stock-info .code { font-size: 12px; color: var(--muted); }
  .stock-info .metric { font-size: 12px; color: var(--muted); }
  .stock-info .metric b { color: var(--text); }
  /* Tabs */
  .tabs { display: flex; gap: 0; padding: 0 16px; background: var(--card); border-bottom: 1px solid var(--border); }
  .tabs button {
    background: none; border: none; color: var(--muted); padding: 8px 16px;
    font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  /* Main layout */
  .main { display: flex; gap: 16px; padding: 16px; }
  .panel { flex: 1; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; margin-bottom: 16px;
  }
  .card h3 { font-size: 14px; margin-bottom: 12px; color: var(--accent); }
  /* Table */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  td { color: var(--text); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.green { color: var(--green); }
  td.red { color: var(--red); }
  td.orange { color: var(--orange); }
  .label-green { color: var(--green); font-weight: 600; }
  .label-red { color: var(--red); font-weight: 600; }
  .label-orange { color: var(--orange); font-weight: 600; }
  /* Highlight box */
  .highlight {
    background: #1a2332; border: 1px solid var(--accent);
    border-radius: 6px; padding: 12px 16px; margin-bottom: 12px;
    display: flex; gap: 24px; flex-wrap: wrap; align-items: baseline;
  }
  .highlight .big { font-size: 24px; font-weight: 700; color: var(--accent); }
  .highlight .label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  /* Piotroski grid */
  .pio-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .pio-item {
    background: #1a2332; border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; text-align: center;
  }
  .pio-item.pass { border-color: var(--green); background: #1a2a1a; }
  .pio-item i { font-style: normal; font-size: 18px; }
  .pio-item .check { color: var(--green); }
  .pio-item .cross { color: var(--red); }
  .pio-item .desc { font-size: 11px; color: var(--muted); margin-top: 4px; }
  /* Status */
  .loading { color: var(--orange); }
  .error { color: var(--red); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Top Bar -->
<nav class="topbar">

  <a href="/realtime-screener.html">实时选股</a>
  <a href="/rps-pool.html">RPS股池</a>

  <a href="/valuation-model.html" class="active">估值模型</a>
  <a href="/technical-score.html">技术面</a>
</nav>

<!-- Search -->
<div class="search-bar">
  <input id="search-input" type="text" placeholder="输入代码/名称 (如 601600)" autofocus>
  <button id="search-btn">查询</button>
  <span id="search-status" class="hidden"></span>
</div>

<!-- Stock Info -->
<div id="stock-info" class="stock-info hidden">
  <span class="name" id="si-name">--</span>
  <span class="code" id="si-code">--</span>
  <span class="metric">价格 <b id="si-price">--</b></span>
  <span class="metric">市值 <b id="si-mcap">--</b>亿</span>
  <span class="metric">报告期 <b id="si-period">--</b></span>
  <span class="metric">β <b id="si-beta">--</b></span>
</div>

<!-- Tabs -->
<div id="tabs" class="tabs hidden">
  <button class="active" data-tab="dcf">DCF 估值</button>
  <button data-tab="wacc">WACC</button>
  <button data-tab="altman">Altman Z</button>
  <button data-tab="piotroski">Piotroski</button>
  <button data-tab="dupont">DuPont</button>
  <button data-tab="gordon">Gordon</button>
  <button data-tab="ev">企业价值</button>
  <button data-tab="summary">财务摘要</button>
</div>

<!-- Content -->
<div class="main">
  <div id="tab-content" class="panel">
    <div class="card"><p style="color:var(--muted)">输入股票代码查询估值模型结果</p></div>
  </div>
</div>

<script type="module" src="/valuation-model.js?v=20260518"></script>
</body>
</html>
