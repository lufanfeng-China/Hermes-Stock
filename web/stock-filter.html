<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>股票筛选</title><link rel="stylesheet" href="/styles.css"><style>
.filter-page{max-width:1560px;margin:0 auto;padding:24px}.filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.filter-group{margin:0;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel)}.filter-group legend{font-weight:700;color:var(--accent);padding:0 6px}.filter-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.filter-fields label{font-size:12px;color:var(--muted)}.filter-fields input,.filter-fields select{width:100%;box-sizing:border-box;margin-top:3px}.pair{display:flex;gap:5px}.pair input{min-width:0}.filter-actions,.filter-meta,.pagination{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.filter-actions{margin:16px 0}.filter-meta{padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:9px}.result-wrap{overflow:auto}.filter-table{width:100%;border-collapse:collapse;font-size:13px}.filter-table th,.filter-table td{white-space:nowrap;padding:9px;border-bottom:1px solid var(--line);text-align:left}.filter-table th{color:var(--muted)}.filter-table td.num{text-align:right}.muted{color:var(--muted)}.hidden{display:none}@media(max-width:900px){.filter-grid{grid-template-columns:1fr}.filter-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header class="topbar"><div><p class="eyebrow">STOCK FILTER</p><h1>股票筛选</h1></div><div class="topbar-actions" id="global-nav"></div></header><main class="filter-page">
<form id="filter-form"><div class="filter-grid">
<fieldset class="filter-group"><legend>① RPS</legend><div class="filter-fields"><label>RPS20<div class="pair"><input name="rps_20_min" type="number" placeholder="最小"><input name="rps_20_max" type="number" placeholder="最大"></div></label><label>RPS50<div class="pair"><input name="rps_50_min" type="number" placeholder="最小"><input name="rps_50_max" type="number" placeholder="最大"></div></label><label>RPS120<div class="pair"><input name="rps_120_min" type="number" placeholder="最小"><input name="rps_120_max" type="number" placeholder="最大"></div></label><label>RPS250<div class="pair"><input name="rps_250_min" type="number" placeholder="最小"><input name="rps_250_max" type="number" placeholder="最大"></div></label><label>RPS总分<div class="pair"><input name="rps_total_min" type="number" placeholder="最小"><input name="rps_total_max" type="number" placeholder="最大"></div></label><label>市场<select name="market"><option value="">不限</option><option value="sh">沪</option><option value="sz">深</option><option value="bj">北</option></select></label></div></fieldset>
<fieldset class="filter-group"><legend>② 基础行情</legend><div class="filter-fields"><label>现价<div class="pair"><input name="price_min" type="number" step="0.01" placeholder="最小"><input name="price_max" type="number" step="0.01" placeholder="最大"></div></label><label>总市值 / 亿<div class="pair"><input name="total_market_cap_min" type="number" step="0.01" placeholder="最小"><input name="total_market_cap_max" type="number" step="0.01" placeholder="最大"></div></label><label>自由流通市值 / 亿<div class="pair"><input name="free_float_market_cap_min" type="number" step="0.01" placeholder="最小"><input name="free_float_market_cap_max" type="number" step="0.01" placeholder="最大"></div></label><label>PE-TTM<div class="pair"><input name="pe_ttm_min" type="number" step="0.01" placeholder="最小"><input name="pe_ttm_max" type="number" step="0.01" placeholder="最大"></div></label><label>PS-TTM<div class="pair"><input name="ps_ttm_min" type="number" step="0.01" placeholder="最小"><input name="ps_ttm_max" type="number" step="0.01" placeholder="最大"></div></label><label>PB / 1/5/20日涨跌幅<span class="muted">快照待补齐</span></label></div></fieldset>
<fieldset class="filter-group"><legend>③ 财务健康</legend><div class="filter-fields"><label>五年年度总分<div class="pair"><input name="annual_total_min" type="number" placeholder="最小"><input name="annual_total_max" type="number" placeholder="最大"></div></label><label>当季总分<div class="pair"><input name="quarterly_total_min" type="number" placeholder="最小"><input name="quarterly_total_max" type="number" placeholder="最大"></div></label><label>年度六维（高级）<select disabled><option>将逐维加入快照</option></select></label><label>当季六维（高级）<select disabled><option>将逐维加入快照</option></select></label></div></fieldset>
<fieldset class="filter-group"><legend>④ 年度派生财报指标</legend><div class="filter-fields"><label>营收CAGR / 利润CAGR<input disabled placeholder="快照构建后启用"></label><label>扣非ROE / 毛利率 / 净利率<input disabled placeholder="快照构建后启用"></label><label>经营现金流 / 自由现金流<input disabled placeholder="快照构建后启用"></label><label>负债率 / 商誉/资产<input disabled placeholder="快照构建后启用"></label><label>应收/营收 / 库存/营收<input disabled placeholder="快照构建后启用"></label></div></fieldset>
<fieldset class="filter-group"><legend>⑤ 趋势</legend><div class="filter-fields"><label>趋势（可多选）<select name="trend" multiple size="3"><option value="bullish">多头</option><option value="strong_bullish">强多头</option><option value="bearish">空头</option></select></label><label>说明<span class="muted">同组 OR；与其他组 AND</span></label></div></fieldset>
<fieldset class="filter-group"><legend>⑥ MACD / 均线金叉</legend><div class="filter-fields"><label>MACD金叉<select name="macd_cross" multiple size="2"><option value="zero_below">零轴下金叉</option><option value="zero_above">零轴上金叉</option></select></label><label>均线金叉<select name="golden_cross" multiple size="3"><option value="5/10">MA5/10</option><option value="10/20">MA10/20</option><option value="20/60">MA20/60</option></select></label></div></fieldset>
<fieldset class="filter-group"><legend>⑦ 特定日期内涨跌幅</legend><div class="filter-fields"><label>开始日<input disabled type="date"></label><label>结束日<input disabled type="date"></label><label>涨跌幅区间<input disabled placeholder="快照构建后启用"></label></div></fieldset>
<fieldset class="filter-group"><legend>⑧ N日换手率</legend><div class="filter-fields"><label>N日<input disabled type="number" value="5"></label><label>累计换手率区间<input disabled placeholder="快照构建后启用"></label><label>日均换手率区间<input disabled placeholder="快照构建后启用"></label></div></fieldset>
</div><div class="filter-actions"><button class="nav-link" type="submit">执行筛选</button><button class="nav-link" type="reset">全部重置</button><label>排序 <select name="sort"><option value="rps_total">RPS总分</option><option value="annual_total">年度总分</option><option value="quarterly_total">当季总分</option></select></label></div></form>
<div id="error" class="error-box hidden"></div><div id="meta" class="filter-meta">填写条件后执行筛选；每页固定 50 只。</div><div class="result-wrap"><table class="filter-table"><thead><tr><th>股票</th><th>行业</th><th class="num">RPS</th><th>年度健康</th><th>当季健康</th><th>趋势</th><th>MACD</th><th>均线金叉</th></tr></thead><tbody id="results"></tbody></table></div><div id="pagination" class="pagination"></div>
</main><script src="/nav.js?v=20261014-stock-filter-v1"></script><script src="/stock-filter.js?v=20261014-v1"></script></body></html>
