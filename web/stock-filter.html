<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="以 RPS、行情、财务健康和技术条件筛选 A 股。">
  <title>股票筛选</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    :root { --sf-bg:#091111; --sf-panel:#0e1c1b; --sf-panel-2:#122522; --sf-line:rgba(151,204,190,.17); --sf-line-strong:rgba(151,204,190,.3); --sf-text:#edf5ef; --sf-muted:#91a9a2; --sf-accent:#b7e36b; --sf-accent-ink:#15220b; --sf-input:#0a1715; --sf-positive:#ff7e72; --sf-negative:#62d6a1; }
    body { background:radial-gradient(circle at 80% -18%,rgba(183,227,107,.11),transparent 32rem),var(--sf-bg); color:var(--sf-text); }
    .stock-filter-page { max-width:1660px; margin:0 auto; padding:24px; }
    .stock-filter-intro { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin:12px 0 20px; }
    .stock-filter-intro h2 { margin:0; font-size:26px; letter-spacing:-.035em; }
    .stock-filter-intro p { max-width:560px; color:var(--sf-muted); margin:7px 0 0; font-size:13px; line-height:1.6; }
    .stock-filter-workbench { display:grid; grid-template-columns:340px minmax(0,1fr); align-items:start; gap:16px; }
    .filter-sidebar, .filter-results-panel { border:1px solid var(--sf-line); border-radius:14px; background:linear-gradient(145deg,rgba(20,37,34,.96),rgba(11,25,23,.96)); box-shadow:0 20px 48px rgba(0,0,0,.16); }
    .filter-sidebar { padding:14px; position:sticky; top:14px; }
    .filter-sidebar-head, .results-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .filter-sidebar-head { padding:4px 3px 13px; }
    .filter-sidebar-head h3, .results-toolbar h3 { margin:0; font-size:15px; letter-spacing:-.015em; }
    .quiet-button, .reset-button, .page-button { color:var(--sf-muted); border:0; background:transparent; cursor:pointer; font:inherit; font-size:12px; padding:6px; border-radius:7px; }
    .quiet-button:hover, .reset-button:hover, .page-button:hover { color:var(--sf-text); background:rgba(255,255,255,.06); }
    .filter-form { display:grid; gap:8px; }
    .filter-group { margin:0; border:1px solid var(--sf-line); border-radius:10px; background:rgba(4,13,12,.24); padding:0 11px 11px; }
    .filter-group legend { padding:0 5px; color:var(--sf-text); font-weight:700; font-size:13px; }
    .filter-group legend span { color:var(--sf-accent); margin-right:6px; }
    .filter-note { color:var(--sf-muted); font-size:11px; line-height:1.45; margin:0 0 9px; }
    .range-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px 8px; }
    .filter-field { display:block; min-width:0; color:#c7d6d0; font-size:11px; line-height:1.3; }
    .filter-field.full { grid-column:1/-1; }
    .range-pair { display:grid; grid-template-columns:minmax(0,1fr) 8px minmax(0,1fr); gap:5px; align-items:center; margin-top:5px; }
    .range-pair b { color:#60756f; text-align:center; font-weight:400; }
    .filter-group input, .filter-group select, .sort-select { box-sizing:border-box; width:100%; border:1px solid rgba(151,204,190,.2); background:var(--sf-input); color:var(--sf-text); border-radius:7px; min-height:30px; padding:5px 7px; font:inherit; font-size:12px; outline:none; }
    .filter-group input:focus, .filter-group select:focus, .sort-select:focus { border-color:var(--sf-accent); box-shadow:0 0 0 3px rgba(183,227,107,.1); }
    .filter-group input::placeholder { color:#59716a; }
    .trend-grid { display:grid; grid-template-columns:1fr; gap:7px; }
    .trend-grid label { display:grid; grid-template-columns:58px minmax(0,1fr); align-items:start; gap:8px; color:#c7d6d0; font-size:11px; }
    .trend-grid select { margin-top:0; }
    .filter-group[data-filter-group="technical"] .range-grid { grid-template-columns:1fr; }
    .filter-submit { width:100%; min-height:40px; border:0; border-radius:9px; color:var(--sf-accent-ink); background:var(--sf-accent); font-weight:800; cursor:pointer; transition:transform .18s ease,filter .18s ease; }
    .filter-submit:hover { filter:brightness(1.08); transform:translateY(-1px); }
    .filter-submit:active { transform:translateY(0) scale(.99); }
    .filter-results-panel { min-width:0; overflow:hidden; }
    .results-toolbar { padding:17px 18px 13px; border-bottom:1px solid var(--sf-line); }
    .result-heading { display:flex; align-items:baseline; gap:9px; }
    .result-heading span { font-size:12px; color:var(--sf-muted); }
    .result-heading strong { color:var(--sf-accent); font-size:17px; font-variant-numeric:tabular-nums; }
    .results-controls { display:flex; align-items:center; gap:9px; }
    .sort-label { color:var(--sf-muted); font-size:12px; white-space:nowrap; }
    .sort-select { width:155px; }
    .filter-status { min-height:20px; padding:10px 18px; color:var(--sf-muted); font-size:12px; border-bottom:1px solid var(--sf-line); }
    .filter-status.error { color:#ff9c91; background:rgba(205,71,64,.08); }
    .result-wrap { overflow:auto; }
    .filter-table { width:100%; min-width:940px; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; }
    .filter-table th { background:rgba(2,10,9,.24); color:#91a9a2; font-weight:600; text-align:left; white-space:nowrap; padding:11px 13px; }
    .filter-table td { border-top:1px solid rgba(151,204,190,.1); padding:12px 13px; white-space:nowrap; color:#d9e6e0; }
    .filter-table tbody tr { transition:background .18s ease; }
    .filter-table tbody tr:hover { background:rgba(183,227,107,.055); }
    .filter-table .num { text-align:right; }
    .stock-link { color:var(--sf-text); text-decoration:none; font-weight:700; }
    .stock-link:hover { color:var(--sf-accent); }
    .stock-code, .subvalue { display:block; margin-top:3px; color:var(--sf-muted); font-size:10px; font-weight:400; }
    .rps-total { color:var(--sf-accent); font-weight:800; }
    .rps-split { color:var(--sf-muted); font-size:10px; }
    .health { display:inline-flex; min-width:31px; justify-content:center; border:1px solid rgba(183,227,107,.24); border-radius:5px; padding:3px 5px; color:#d9eab8; background:rgba(183,227,107,.06); }
    .empty-state { padding:40px 18px; text-align:center; color:var(--sf-muted); }
    .pagination { display:flex; justify-content:flex-end; align-items:center; gap:6px; padding:13px 18px; border-top:1px solid var(--sf-line); }
    .page-button { border:1px solid var(--sf-line); min-width:31px; color:var(--sf-text); }
    .page-button:disabled { opacity:.38; cursor:not-allowed; }
    .page-meta { margin-right:auto; color:var(--sf-muted); font-size:11px; }
    .hidden { display:none; }
    @media (max-width:1050px) { .stock-filter-workbench { grid-template-columns:290px minmax(0,1fr); } .trend-grid { grid-template-columns:1fr; } }
    @media (max-width:780px) { .stock-filter-page { padding:14px; } .stock-filter-intro { display:block; } .stock-filter-workbench { grid-template-columns:1fr; } .filter-sidebar { position:static; } .results-toolbar { align-items:flex-start; flex-direction:column; } .results-controls { width:100%; } .sort-select { flex:1; } }
  </style>
</head>
<body>
  <header class="topbar"><div><p class="eyebrow">STOCK FILTER</p><h1>股票筛选</h1></div><div class="topbar-actions" id="global-nav"></div></header>
  <main class="stock-filter-page">
    <section class="stock-filter-intro" aria-labelledby="filter-page-title">
      <div><h2 id="filter-page-title">条件选股</h2><p>所有条件在全市场范围内先过滤、再排序分页。RPS 使用本地最新交易日截面排名；五年年度与当季财务健康严格分开。</p></div>
      <button class="quiet-button" type="button" id="reset-top">↻ 重置全部条件</button>
    </section>
    <div class="stock-filter-workbench">
      <aside class="filter-sidebar" aria-label="筛选条件">
        <div class="filter-sidebar-head"><h3>筛选条件</h3><button class="reset-button" type="reset" form="filter-form">重置</button></div>
        <form id="filter-form" class="filter-form">
          <fieldset class="filter-group" data-filter-group="rps"><legend><span>01</span>RPS 强度</legend><div class="range-grid">
            <label class="filter-field">RPS20<div class="range-pair"><input name="rps_20_min" type="number" min="0" max="100" placeholder="最小"><b>—</b><input name="rps_20_max" type="number" min="0" max="100" placeholder="最大"></div></label>
            <label class="filter-field">RPS50<div class="range-pair"><input name="rps_50_min" type="number" min="0" max="100" placeholder="最小"><b>—</b><input name="rps_50_max" type="number" min="0" max="100" placeholder="最大"></div></label>
            <label class="filter-field">RPS120<div class="range-pair"><input name="rps_120_min" type="number" min="0" max="100" placeholder="最小"><b>—</b><input name="rps_120_max" type="number" min="0" max="100" placeholder="最大"></div></label>
            <label class="filter-field">RPS250<div class="range-pair"><input name="rps_250_min" type="number" min="0" max="100" placeholder="最小"><b>—</b><input name="rps_250_max" type="number" min="0" max="100" placeholder="最大"></div></label>
            <label class="filter-field full">RPS Total<div class="range-pair"><input name="rps_total_min" type="number" min="0" max="400" placeholder="最小"><b>—</b><input name="rps_total_max" type="number" min="0" max="400" placeholder="最大"></div></label>
          </div></fieldset>
          <fieldset class="filter-group" data-filter-group="market"><legend><span>02</span>基础行情</legend><div class="range-grid">
            <label class="filter-field">现价（元）<div class="range-pair"><input name="price_min" type="number" step="0.01" placeholder="最小"><b>—</b><input name="price_max" type="number" step="0.01" placeholder="最大"></div></label>
            <label class="filter-field">PE-TTM<div class="range-pair"><input name="pe_ttm_min" type="number" step="0.01" placeholder="最小"><b>—</b><input name="pe_ttm_max" type="number" step="0.01" placeholder="最大"></div></label>
            <label class="filter-field">总市值（亿）<div class="range-pair"><input name="total_market_cap_min" type="number" step="0.01" placeholder="最小"><b>—</b><input name="total_market_cap_max" type="number" step="0.01" placeholder="最大"></div></label>
            <label class="filter-field">流通市值（亿）<div class="range-pair"><input name="free_float_market_cap_min" type="number" step="0.01" placeholder="最小"><b>—</b><input name="free_float_market_cap_max" type="number" step="0.01" placeholder="最大"></div></label>
          </div></fieldset>
          <fieldset class="filter-group" data-filter-group="financial"><legend><span>03</span>财务健康</legend><div class="range-grid">
            <label class="filter-field">五年总分<div class="range-pair"><input name="annual_total_min" type="number" min="0" max="100" placeholder="最小"><b>—</b><input name="annual_total_max" type="number" min="0" max="100" placeholder="最大"></div></label>
            <label class="filter-field">当季总分<div class="range-pair"><input name="quarterly_total_min" type="number" min="0" max="100" placeholder="最小"><b>—</b><input name="quarterly_total_max" type="number" min="0" max="100" placeholder="最大"></div></label>
          </div></fieldset>
          <fieldset class="filter-group" data-filter-group="trend"><legend><span>04</span>趋势过滤</legend><div class="trend-grid">
            <label>日线<select name="trend_daily" multiple size="3"><option value="strong_bullish">强多头</option><option value="bullish">多头</option><option value="bearish">空头</option></select></label>
            <label>周线<select name="trend_weekly" multiple size="3"><option value="strong_bullish">强多头</option><option value="bullish">多头</option><option value="bearish">空头</option></select></label>
            <label>月线<select name="trend_monthly" multiple size="3"><option value="strong_bullish">强多头</option><option value="bullish">多头</option><option value="bearish">空头</option></select></label>
          </div></fieldset>
          <fieldset class="filter-group" data-filter-group="technical"><legend><span>05</span>MACD / 均线金叉</legend><div class="range-grid">
            <label class="filter-field">MACD 金叉<select name="macd_cross" multiple size="2"><option value="zero_below">零轴下金叉</option><option value="zero_above">零轴上金叉</option></select></label>
            <label class="filter-field">均线金叉<select name="golden_cross" multiple size="3"><option value="5/10">MA5 / MA10</option><option value="10/20">MA10 / MA20</option><option value="20/60">MA20 / MA60</option></select></label>
          </div></fieldset>
          <button class="filter-submit" type="submit">⌕ 开始筛选</button>
        </form>
      </aside>
      <section class="filter-results-panel" aria-labelledby="filter-results-title">
        <div class="results-toolbar"><div class="result-heading"><h3 id="filter-results-title">筛选结果</h3><span>共 <strong id="match-count">—</strong> 只股票</span></div><div class="results-controls"><label class="sort-label" for="sort">排序方式</label><select id="sort" class="sort-select" name="sort" form="filter-form"><option value="rps_total">RPS Total（降序）</option><option value="annual_total">五年总分（降序）</option><option value="quarterly_total">当季总分（降序）</option><option value="price">现价（降序）</option><option value="total_market_cap">总市值（降序）</option><option value="pe_ttm">PE-TTM（降序）</option></select></div></div>
        <div id="status" class="filter-status">正在加载全市场筛选快照…</div>
        <div class="result-wrap"><table class="filter-table"><thead><tr><th>股票</th><th>行业</th><th class="num">现价</th><th class="num">RPS Total</th><th>五年健康</th><th>当季健康</th><th>日 / 周 / 月趋势</th><th>金叉</th></tr></thead><tbody id="results"></tbody></table></div>
        <div id="pagination" class="pagination"></div>
      </section>
    </div>
  </main>
  <script src="/nav.js?v=20261015-stock-filter-v2"></script>
  <script src="/stock-filter.js?v=20261015-v2"></script>
</body>
</html>
