<body><main class="page"><div id="global-nav"></div><header class="hero"><div><p class="eyebrow">CONCEPT TEMPERATURE</p><h1>概念板块温度</h1><p class="sub">基于通达信概念映射和前复权行情。温度衡量价格强度、上涨广度、相对超额、强势股扩散与量能活跃度，不构成交易建议。</p></div></header>
