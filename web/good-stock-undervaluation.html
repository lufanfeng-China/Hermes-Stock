<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>好股 + 低估诊断</title><link rel="stylesheet" href="/styles.css"><style>
.diag-page{max-width:1360px;margin:0 auto;padding:28px 24px 72px}.diag-page h1{font-size:32px;line-height:1.15;margin:0 0 8px}.diag-subtitle{max-width:780px;margin:0 0 18px;color:var(--muted)}
.diag-query{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:26px 0 20px;padding:16px;border:1px solid rgba(127,153,170,.35);border-radius:10px;background:rgba(17,36,47,.72)}.diag-query label{display:grid;gap:6px;color:var(--muted);font-size:13px}.diag-query input,.diag-query select{height:38px;padding:0 10px;border:1px solid #365366;border-radius:6px;background:#0c1c27;color:var(--text);font:inherit}.diag-query button{height:38px;padding:0 16px;border:0;border-radius:6px;background:var(--accent);color:#09212b;font-weight:700;cursor:pointer}.diag-status{align-self:center;color:var(--muted);font-size:14px}
.diag-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.diag-card{min-width:0;border:1px solid rgba(127,153,170,.35);border-radius:10px;padding:16px;background:rgba(17,36,47,.72)}.diag-card h3{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:500}.diag-value{font-size:19px;font-weight:750;overflow-wrap:anywhere}.diag-detail{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.45;overflow-wrap:anywhere}.ok{color:var(--accent)}.bad{color:var(--danger)}
.diag-audit{margin-top:20px;border-top:1px solid rgba(127,153,170,.35);padding-top:16px}.diag-audit summary{cursor:pointer;color:var(--muted)}.diag-audit pre{max-height:440px;overflow:auto;margin-top:12px;padding:14px;border-radius:8px;background:#0b1821;color:#b8cbdb;font-size:12px;line-height:1.45;white-space:pre-wrap;word-break:break-word}@media(max-width:800px){.diag-page{padding:20px 14px}.diag-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.diag-grid{grid-template-columns:1fr}.diag-page h1{font-size:27px}}
</style></head><body><main class="diag-page"><header><h1>好股 + 低估诊断</h1><p class="diag-subtitle">当前状态诊断：年度质量、行业相对估值、公司自身历史估值与季度动量分层展示。不提供历史日结论或买卖建议。</p><div id="global-nav"></div></header><section class="diag-query"><label>股票代码<input id="symbol" value="600519" maxlength="6" inputmode="numeric"></label><label>市场<select id="market"><option value="sh">沪市</option><option value="sz">深市</option><option value="bj">北交所</option></select></label><button id="run">诊断当前状态</button><span id="status" class="diag-status"></span></section><section id="result" hidden><div id="summary" class="diag-grid"></div><details class="diag-audit"><summary>查看完整审计证据（JSON）</summary><pre id="audit"></pre></details></section><section class="diag-audit"><h2>当前分类清单</h2><p class="diag-subtitle">按当前快照直接浏览，不需要逐只查询。</p><select id="list-category"><option value="has_margin">质量合格且具估值安全边际</option><option value="quality_no_margin">质量合格但当前估值不低</option><option value="quality_ineligible">年度质量未达标</option><option value="not_applicable">不适用行业</option><option value="evidence_unavailable">估值证据不足</option></select><div id="list-status" class="diag-status"></div><button id="list-prev" type="button">上一页</button> <button id="list-next" type="button">下一页</button><div style="overflow:auto"><table id="list-table"></table></div></section></main><script src="/nav.js"></script><script src="/good-stock-undervaluation.js?v=20261022-v4"></script></body></html>
